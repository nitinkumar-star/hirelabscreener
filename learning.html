<style id="app-css">
/* Layout idea: a field guide with a fixed left rail of views; each view opens on a picture (map, tree, heatmap) and puts detail below it. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141A23; --muted:#5A6476; --line:#DCE1E8;
  --accent:#1F57D1; --accent-soft:#E5ECFB; --amber:#B7740A; --amber-soft:#FBF0DC;
  --good:#1D7F52; --crit:#B4361C;
  --co-schneider:#1D7F52; --co-siemens:#0B7C86; --co-lk:#2E52A8; --co-legrand:#B4361C; --co-peer:#6A7385;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,26,35,.06),0 4px 14px rgba(20,26,35,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#161B23; --ink:#E7EBF1; --muted:#9AA4B5; --line:#2A313C;
    --accent:#7AA2F7; --accent-soft:#1B2944; --amber:#E2A64A; --amber-soft:#3A2C14;
    --good:#4CC28C; --crit:#F08A6B;
    --co-schneider:#4CC28C; --co-siemens:#3FC1C9; --co-lk:#7FA0F0; --co-legrand:#F08A6B; --co-peer:#9AA4B5;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161B23; --ink:#E7EBF1; --muted:#9AA4B5; --line:#2A313C;
  --accent:#7AA2F7; --accent-soft:#1B2944; --amber:#E2A64A; --amber-soft:#3A2C14;
  --good:#4CC28C; --crit:#F08A6B;
  --co-schneider:#4CC28C; --co-siemens:#3FC1C9; --co-lk:#7FA0F0; --co-legrand:#F08A6B; --co-peer:#9AA4B5;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:.2px}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--co-peer)}
.save{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.save b{color:var(--ink);font-weight:600}
main{padding:28px 32px 64px;max-width:1200px;width:100%}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.1}
h2{font-size:22px;margin-bottom:6px}
h3{font-size:17px}
.lead{color:var(--muted);max-width:68ch;margin:8px 0 0}
.sec{margin-top:32px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface);color:var(--ink);white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on,button.chip.on:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
.pill.strong{background:var(--accent);color:#fff}
.pill.present{background:var(--accent-soft);color:var(--accent)}
.pill.verify{background:var(--amber-soft);color:var(--amber)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
table{border-collapse:collapse;width:100%}
.scroll{overflow-x:auto}
/* overview */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:stretch}
.callout{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.callout b{color:var(--ink)}
.cocard{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;border-top:4px solid var(--co-peer)}
.cocard:hover{border-color:var(--accent);border-top-color:inherit}
.cocard .tag{font-size:13px;color:var(--muted)}
.cocard ul{margin:0;padding-left:18px;font-size:13.5px}
.peer{display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;padding:12px 14px}
.peer:hover{border-color:var(--accent)}
.cluster h3{font-size:14px;color:var(--muted);font-family:var(--font-body);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.map3{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;align-items:stretch;gap:0}
.map3 .col{display:flex;flex-direction:column;gap:8px}
.map3 .colh{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2px}
.node{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;width:100%}
.node b{display:block;font-size:14px}
.node span{display:block;font-size:12.5px;color:var(--muted)}
.node:hover{border-color:var(--accent)}
.node.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.node.dim{opacity:.45}
.arrowcol{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.influ{grid-column:3 / 6;margin-top:10px;border:1.5px dashed var(--amber);background:var(--amber-soft);border-radius:10px;padding:9px 12px;font-size:13.5px}
.result{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
/* company */
.cohead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-left:6px solid var(--co-peer);padding-left:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.fact .k{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1}
.fact a{font-size:12px}
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.tree .root{border:2px solid var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;background:var(--surface);text-align:center;max-width:420px}
.tree .stem{width:2px;height:18px;background:var(--line)}
.tree .kids{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;padding-top:18px;border-top:2px solid var(--line);width:100%}
.tree .kid{flex:1 1 200px;max-width:280px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:13px;position:relative}
.tree .kid::before{content:"";position:absolute;top:-19px;left:50%;width:2px;height:18px;background:var(--line)}
.tree .kid b{display:block;font-size:14px;margin-bottom:2px}
.tree .kid .sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.tree .kid .sub div{font-size:12.5px}
.tree .kid.hl{border-color:var(--accent);background:var(--accent-soft)}
.bu{display:flex;flex-direction:column;gap:8px}
.bu .who{font-size:12.5px;color:var(--muted)}
.foot{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:16px;align-items:start}
.sites{display:flex;flex-direction:column;gap:6px}
.site{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 8px;border-radius:8px;cursor:default}
.site:hover,.site.on{background:var(--accent-soft)}
.sym{width:12px;height:12px;flex:none;border-radius:50%;background:var(--accent)}
.sym.rd{border-radius:3px;background:var(--amber)}
.sym.hq{background:var(--ink)}
.sym.tc{background:transparent;border:2px solid var(--muted)}
.sym.new{background:var(--good)}
.tl{display:flex;gap:0;overflow-x:auto;padding:8px 2px 4px}
.tl .step{flex:1 0 150px;position:relative;padding:22px 12px 0 0}
.tl .step::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.tl .step::after{content:"";position:absolute;top:2px;left:0;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .yr{font-family:var(--font-mono);font-size:13px;color:var(--accent);font-weight:500}
.tl .tx{font-size:13px;margin-top:2px}
.learn{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:start;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
/* matrix */
.hm th,.hm td{border-bottom:1px solid var(--line);padding:0}
.hm th{font-size:12.5px;font-weight:600;text-align:center;padding:8px 6px;color:var(--muted);white-space:nowrap}
.hm th.rowh{text-align:left;padding:6px 10px 6px 0;color:var(--ink);font-weight:500;white-space:normal;min-width:190px}
.hm th.rowh button{all:unset;cursor:pointer;display:block;width:100%}
.hm th.rowh button:hover{color:var(--accent)}
.hm th.rowh.on{color:var(--accent)}
.hm th.colh button{all:unset;cursor:pointer}
.hm th.colh button:hover{color:var(--accent)}
.cell{display:flex;align-items:center;justify-content:center;height:40px;margin:3px;border-radius:7px;font-size:12px;font-weight:600}
.cell.s2{background:var(--accent);color:#fff}
.cell.s1{background:var(--accent-soft);color:var(--accent)}
.cell.s0{color:var(--line)}
.cell.edited{box-shadow:0 0 0 2px var(--amber) inset}
.hm.editing .cell{cursor:pointer}
.hm.editing .cell:hover{outline:2px dashed var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
/* talent */
.tm{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.pool{cursor:pointer}
.pool rect{transition:fill .15s}
.pool:hover rect{stroke:var(--accent)}
/* roles */
.role{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.role.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.role .m{font-size:13px}
.ladder input{width:56px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--font-mono);font-size:13px}
/* trends */
.trend{display:flex;flex-direction:column;gap:10px}
.trend .num{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
/* glossary */
.search{width:100%;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.term{display:flex;flex-direction:column;gap:4px}
.term b{font-family:var(--font-display);font-size:18px}
/* call kit */
.q{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.q input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
/* log */
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.form .wide{grid-column:1 / -1}
.form textarea{min-height:70px;resize:vertical}
.entry{display:grid;grid-template-columns:100px 150px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.entry .acts{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.banner{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav-label{display:none}
  .nav a{white-space:nowrap}
  .save{margin-top:0;border-top:0;padding-top:0}
  main{padding:20px 16px 48px}
  .hero,.foot,.tm{grid-template-columns:1fr}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entry{grid-template-columns:90px 1fr;}
  .entry .acts{grid-column:1 / -1}
}
@media (max-width:600px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .map3{grid-template-columns:1fr}
  .arrowcol{transform:rotate(90deg);height:24px}
  .influ{grid-column:1}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

var artifactApi = null, saveState = "checking", saveTimer = null;
function buildDoc(){
  var css = document.getElementById("app-css").textContent;
  var js = document.getElementById("app-js").textContent;
  var st = JSON.stringify(STATE).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>"+TITLE+"</title>\n"+FONT_LINKS+"\n<style id=\"app-css\">"+css+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<script id=\"state\" type=\"application/json\">"+st+"<\/script>\n<script id=\"app-js\">"+js+"<\/script>\n</body>\n</html>\n";
}
function setSave(s){ saveState = s; var el = $("#savebox"); if (el) el.innerHTML = saveLabel(); }
function saveLabel(){
  if (saveState==="ok") return "<b>Edits save to HireLab.</b><br>Everyone in your agency sees them.";
  if (saveState==="saving") return "<b>Saving…</b>";
  if (saveState==="pending") return "<b>Unsaved change</b>, saving in a moment.";
  if (saveState==="readonly") return "<b>View only.</b> You can browse, but edits made here are not kept.";
  if (saveState==="error") return "<b>Save failed.</b> Your last change was not kept; try again.";
  return "Checking whether edits can be saved…";
}
function persist(){
  try { localStorage.setItem("eie-view", location.hash || "#overview"); } catch(e){}
  if (!artifactApi){ setSave("readonly"); render(); return; }
  setSave("pending");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    setSave("saving");
    artifactApi.publish(buildDoc()).then(function(){ setSave("ok"); }).catch(function(e){
      var code = e && (e.code || e.name || e.message) || "";
      if (/not_granted|not_writer/.test(String(code))) setSave("readonly");
      else if (/conflict/.test(String(code))) setSave("ok");
      else setSave("error");
    });
  }, 900);
  render();
}
try {
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function(a){ artifactApi = a; setSave(a ? "ok" : "readonly"); }).catch(function(){ setSave("readonly"); });
  } else { setTimeout(function(){ setSave("readonly"); }, 0); }
} catch(e){ setSave("readonly"); }

function siteMap(c){
  var W=340, H=380, x0=67, x1=98, y0=7, y1=37;
  function px(lon){ return 16+(lon-x0)/(x1-x0)*(W-32); }
  function py(lat){ return 16+(y1-lat)/(y1-y0)*(H-32); }
  var d = OUTLINE.map(function(p,i){ return (i?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1); }).join("")+"Z";
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Approximate map of '+esc(c.short)+' sites in India" style="width:100%;height:auto;max-width:380px">';
  svg += '<path d="'+d+'" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>';
  Object.keys(CITY).forEach(function(k){ svg += '<circle cx="'+px(CITY[k][0]).toFixed(1)+'" cy="'+py(CITY[k][1]).toFixed(1)+'" r="2" fill="var(--line)"/>'; });
  var placed = [];
  var sites = c.sites.slice().sort(function(a,b){ return CITY[b.c][1]-CITY[a.c][1]; });
  sites.forEach(function(s, i){
    var p = CITY[s.c]; if (!p) return;
    var x = px(p[0]), y = py(p[1]);
    var col = s.t==="rd"?"var(--amber)":s.t==="hq"?"var(--ink)":s.t==="new"?"var(--good)":s.t==="tc"?"var(--muted)":"var(--accent)";
    var shape = s.t==="rd" ? '<rect x="'+(x-5)+'" y="'+(y-5)+'" width="10" height="10" rx="2" fill="'+col+'"/>' : s.t==="tc" ? '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="var(--surface)" stroke="'+col+'" stroke-width="2"/>' : '<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="'+col+'" stroke="var(--surface)" stroke-width="1.5"/>';
    var left = x > W*0.62;
    var lx = left ? x-9 : x+9, ly = y+4;
    placed.forEach(function(q){ if (Math.abs(q.x-lx)<80 && Math.abs(q.y-ly)<12 && q.left===left) ly = q.y+12; });
    placed.push({x:lx,y:ly,left:left});
    svg += '<g class="mk" data-site="'+i+'">'+shape+'<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="11" fill="var(--ink)" text-anchor="'+(left?"end":"start")+'" style="paint-order:stroke;stroke:var(--surface);stroke-width:3px">'+esc(s.c)+'</text></g>';
  });
  svg += '</svg>';
  return svg;
}

function render(){
  var v = currentView(), inner;
  if (v.indexOf("company-")===0) inner = vCompany(v.slice(8));
  else inner = {overview:vOverview, matrix:vMatrix, talent:vTalent, roles:vRoles, trends:vTrends, glossary:vGlossary, callkit:vCallkit, log:vLog}[v]();
  document.getElementById("app").innerHTML = shell(inner, v);
  var t = document.title; if (t !== TITLE) document.title = TITLE;
}
function go(hash){ if (location.hash === "#"+hash) { render(); window.scrollTo(0,0); } else { location.hash = hash; } }

document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-go],[data-layer],[data-act],[data-seg],[data-cell],[data-pool],[data-role],[data-rolego],[data-gg],[data-qtab],[data-logco],[data-edit],[data-del],[data-addlog]");
  if (!el) return;
  var d = el.dataset;
  if (d.go){ ev.preventDefault(); go(d.go); return; }
  if (d.layer){ ui.layer = ui.layer===d.layer ? null : d.layer; render(); return; }
  if (d.seg){ ui.seg = ui.seg===d.seg ? null : d.seg; render(); return; }
  if (d.cell !== undefined){
    if (!ui.editM){ var p0 = d.cell.split("|"); ui.seg = p0[0]; render(); return; }
    var p = d.cell.split("|"), seg = SEGS.filter(function(s){return s.id===p[0];})[0], ci = +p[1];
    var nv = (rating(seg,ci)+2)%3; var k = p[0]+"|"+MCOLS[ci];
    if (nv === seg.r[ci]) delete STATE.matrix[k]; else STATE.matrix[k] = nv;
    persist(); return;
  }
  if (d.pool){ ui.pool = d.pool; render(); return; }
  if (d.role !== undefined && el.classList.contains("chip")){ ui.role = d.role || null; if (ui.role){ var r = ROLES.filter(function(x){return x.id===ui.role;})[0]; ui.pool = r.pools[0]; } render(); return; }
  if (d.rolego){ ui.role = d.rolego; ui.pool = ROLES.filter(function(x){return x.id===d.rolego;})[0].pools[0]; go("talent"); return; }
  if (d.gg){ ui.gg = d.gg; render(); return; }
  if (d.qtab){ ui.qtab = d.qtab; render(); return; }
  if (d.logco){ ui.logco = d.logco; render(); return; }
  if (d.addlog){ ui.prefillCo = d.addlog; ui.editId = null; go("log"); return; }
  if (d.edit){ ui.editId = d.edit; render(); window.scrollTo(0,0); return; }
  if (d.del){
    if (pendingDel === d.del){ STATE.log = STATE.log.filter(function(x){return x.id!==d.del;}); pendingDel = null; persist(); }
    else { pendingDel = d.del; el.textContent = "Click again to delete"; el.style.borderColor = "var(--crit)"; el.style.color = "var(--crit)"; setTimeout(function(){ if (pendingDel===d.del){ pendingDel=null; render(); } }, 3000); }
    return;
  }
  if (d.act==="clearlayer"){ ui.layer=null; render(); return; }
  if (d.act==="resetm"){ STATE.matrix = {}; persist(); return; }
  if (d.act==="canceledit"){ ui.editId=null; render(); return; }
  if (d.act==="savepay"){
    var np = PAY0.map(function(p,i){ var lo = parseFloat($("#plo"+i).value), hi = parseFloat($("#phi"+i).value); if (!(lo>0)) lo = p.lo; if (!(hi>0)) hi = p.hi; if (hi<lo){ var t=hi; hi=lo; lo=t; } return {l:p.l,t:p.t,e:p.e,lo:lo,hi:hi}; });
    STATE.pay = np; ui.editP = false; persist(); return;
  }
  if (d.act==="resetpay"){ STATE.pay = null; ui.editP=false; persist(); return; }
});
document.addEventListener("keydown", function(ev){
  if ((ev.key==="Enter"||ev.key===" ") && ev.target.closest && ev.target.closest("[data-pool]")){ ev.preventDefault(); ui.pool = ev.target.closest("[data-pool]").dataset.pool; render(); }
});
document.addEventListener("change", function(ev){
  if (ev.target.id==="editM"){ ui.editM = ev.target.checked; render(); }
  if (ev.target.id==="editP"){ ui.editP = ev.target.checked; render(); }
});
document.addEventListener("input", function(ev){
  if (ev.target.id==="gq"){ ui.gq = ev.target.value; var q = ui.gq.toLowerCase(); var list = GLOSS.filter(function(g){ return (ui.gg==="All"||g[0]===ui.gg) && (!q || (g[1]+" "+g[2]+" "+g[3]).toLowerCase().indexOf(q)>=0); }); var gl = $("#glist"); if (gl) gl.innerHTML = glossCards(list); }
});
document.addEventListener("submit", function(ev){
  if (ev.target.id !== "logform") return;
  ev.preventDefault();
  var text = $("#f-text").value.trim(); if (!text) return;
  var rec = {date:$("#f-date").value||today(), co:$("#f-co").value, bu:$("#f-bu").value.trim(), from:$("#f-from").value.trim(), text:text, conf:+$("#f-conf").value, moved:$("#f-moved").value==="1"};
  if (ui.editId){ STATE.log = STATE.log.map(function(x){ if (x.id===ui.editId){ rec.id = x.id; return rec; } return x; }); ui.editId = null; }
  else { rec.id = "e"+Date.now().toString(36); STATE.log.push(rec); }
  ui.prefillCo = null;
  persist();
});
window.addEventListener("hashchange", function(){ render(); window.scrollTo(0,0); try { localStorage.setItem("eie-view", location.hash); } catch(e){} });

try { if (!location.hash){ var last = localStorage.getItem("eie-view"); if (last && last.length>1) history.replaceState(null, "", last); } } catch(e){}
render();
})();
</script>
</body>
</html>
