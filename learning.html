<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electrical Industry Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-css">
/* Layout idea: a field guide with a fixed left rail of views; each view opens on a picture (map, tree, heatmap) and puts detail below it. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141A23; --muted:#5A6476; --line:#DCE1E8;
  --accent:#1F57D1; --accent-soft:#E5ECFB; --amber:#B7740A; --amber-soft:#FBF0DC;
  --good:#1D7F52; --crit:#B4361C;
  --co-schneider:#1D7F52; --co-siemens:#0B7C86; --co-lk:#2E52A8; --co-legrand:#B4361C; --co-peer:#6A7385;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,26,35,.06),0 4px 14px rgba(20,26,35,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#161B23; --ink:#E7EBF1; --muted:#9AA4B5; --line:#2A313C;
    --accent:#7AA2F7; --accent-soft:#1B2944; --amber:#E2A64A; --amber-soft:#3A2C14;
    --good:#4CC28C; --crit:#F08A6B;
    --co-schneider:#4CC28C; --co-siemens:#3FC1C9; --co-lk:#7FA0F0; --co-legrand:#F08A6B; --co-peer:#9AA4B5;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161B23; --ink:#E7EBF1; --muted:#9AA4B5; --line:#2A313C;
  --accent:#7AA2F7; --accent-soft:#1B2944; --amber:#E2A64A; --amber-soft:#3A2C14;
  --good:#4CC28C; --crit:#F08A6B;
  --co-schneider:#4CC28C; --co-siemens:#3FC1C9; --co-lk:#7FA0F0; --co-legrand:#F08A6B; --co-peer:#9AA4B5;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:.2px}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--co-peer)}
.save{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.save b{color:var(--ink);font-weight:600}
main{padding:28px 32px 64px;max-width:1200px;width:100%}
h1,h2,h3{font-family:var(--font-display);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.1}
h2{font-size:22px;margin-bottom:6px}
h3{font-size:17px}
.lead{color:var(--muted);max-width:68ch;margin:8px 0 0}
.sec{margin-top:32px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface);color:var(--ink);white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on,button.chip.on:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
.pill.strong{background:var(--accent);color:#fff}
.pill.present{background:var(--accent-soft);color:var(--accent)}
.pill.verify{background:var(--amber-soft);color:var(--amber)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
table{border-collapse:collapse;width:100%}
.scroll{overflow-x:auto}
/* overview */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:stretch}
.callout{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.callout b{color:var(--ink)}
.cocard{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;border-top:4px solid var(--co-peer)}
.cocard:hover{border-color:var(--accent);border-top-color:inherit}
.cocard .tag{font-size:13px;color:var(--muted)}
.cocard ul{margin:0;padding-left:18px;font-size:13.5px}
.peer{display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;padding:12px 14px}
.peer:hover{border-color:var(--accent)}
.cluster h3{font-size:14px;color:var(--muted);font-family:var(--font-body);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.map3{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;align-items:stretch;gap:0}
.map3 .col{display:flex;flex-direction:column;gap:8px}
.map3 .colh{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2px}
.node{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;width:100%}
.node b{display:block;font-size:14px}
.node span{display:block;font-size:12.5px;color:var(--muted)}
.node:hover{border-color:var(--accent)}
.node.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.node.dim{opacity:.45}
.arrowcol{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.influ{grid-column:3 / 6;margin-top:10px;border:1.5px dashed var(--amber);background:var(--amber-soft);border-radius:10px;padding:9px 12px;font-size:13.5px}
.result{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
/* company */
.cohead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-left:6px solid var(--co-peer);padding-left:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.fact .k{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.1}
.fact a{font-size:12px}
.tree{display:flex;flex-direction:column;align-items:center;gap:0}
.tree .root{border:2px solid var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;background:var(--surface);text-align:center;max-width:420px}
.tree .stem{width:2px;height:18px;background:var(--line)}
.tree .kids{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;padding-top:18px;border-top:2px solid var(--line);width:100%}
.tree .kid{flex:1 1 200px;max-width:280px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:13px;position:relative}
.tree .kid::before{content:"";position:absolute;top:-19px;left:50%;width:2px;height:18px;background:var(--line)}
.tree .kid b{display:block;font-size:14px;margin-bottom:2px}
.tree .kid .sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:4px}
.tree .kid .sub div{font-size:12.5px}
.tree .kid.hl{border-color:var(--accent);background:var(--accent-soft)}
.bu{display:flex;flex-direction:column;gap:8px}
.bu .who{font-size:12.5px;color:var(--muted)}
.foot{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:16px;align-items:start}
.sites{display:flex;flex-direction:column;gap:6px}
.site{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 8px;border-radius:8px;cursor:default}
.site:hover,.site.on{background:var(--accent-soft)}
.sym{width:12px;height:12px;flex:none;border-radius:50%;background:var(--accent)}
.sym.rd{border-radius:3px;background:var(--amber)}
.sym.hq{background:var(--ink)}
.sym.tc{background:transparent;border:2px solid var(--muted)}
.sym.new{background:var(--good)}
.tl{display:flex;gap:0;overflow-x:auto;padding:8px 2px 4px}
.tl .step{flex:1 0 150px;position:relative;padding:22px 12px 0 0}
.tl .step::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.tl .step::after{content:"";position:absolute;top:2px;left:0;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .yr{font-family:var(--font-mono);font-size:13px;color:var(--accent);font-weight:500}
.tl .tx{font-size:13px;margin-top:2px}
.learn{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:start;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
/* matrix */
.hm th,.hm td{border-bottom:1px solid var(--line);padding:0}
.hm th{font-size:12px;font-weight:600;text-align:center;padding:8px 6px;color:var(--muted);white-space:nowrap}
.hm th.grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--line);padding:6px 4px 4px}
.hm th.rowh{position:sticky;left:0;background:var(--surface);z-index:1;text-align:left;padding:6px 10px 6px 0;color:var(--ink);font-weight:500;white-space:normal;min-width:190px}
.hm th.rowh button{all:unset;cursor:pointer;display:block;width:100%}
.hm th.rowh button:hover{color:var(--accent)}
.hm th.rowh.on{color:var(--accent)}
.hm th.colh button{all:unset;cursor:pointer}
.hm th.colh button:hover{color:var(--accent)}
.cell{display:flex;align-items:center;justify-content:center;height:34px;min-width:54px;margin:2px;border-radius:6px;font-size:11px;font-weight:600}
.cell.s2{background:var(--accent);color:#fff}
.cell.s1{background:var(--accent-soft);color:var(--accent)}
.cell.s0{color:var(--line)}
.cell.edited{box-shadow:0 0 0 2px var(--amber) inset}
.hm.editing .cell{cursor:pointer}
.hm.editing .cell:hover{outline:2px dashed var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
/* talent */
.tm{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.pool{cursor:pointer}
.pool rect{transition:fill .15s}
.pool:hover rect{stroke:var(--accent)}
/* roles */
.role{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.role.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.role .m{font-size:13px}
.ladder input{width:56px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--font-mono);font-size:13px}
/* trends */
.trend{display:flex;flex-direction:column;gap:10px}
.trend .num{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
/* glossary */
.search{width:100%;max-width:420px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.term{display:flex;flex-direction:column;gap:4px}
.term b{font-family:var(--font-display);font-size:18px}
/* call kit */
.q{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.q input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
/* log */
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.form .wide{grid-column:1 / -1}
.form textarea{min-height:70px;resize:vertical}
.entry{display:grid;grid-template-columns:100px 150px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.entry .acts{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.banner{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav-label{display:none}
  .nav a{white-space:nowrap}
  .save{margin-top:0;border-top:0;padding-top:0}
  main{padding:20px 16px 48px}
  .hero,.foot,.tm{grid-template-columns:1fr}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entry{grid-template-columns:90px 1fr;}
  .entry .acts{grid-column:1 / -1}
}
@media (max-width:600px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .map3{grid-template-columns:1fr}
  .arrowcol{transform:rotate(90deg);height:24px}
  .influ{grid-column:1}
  .form{grid-template-columns:1fr}
}

/* ---- content editor ---- */
#main{min-width:0}
.ef>*,.erow>*,.elist>*{min-width:0}
.elist>.eitem{margin:0}
.echips select{border:0;background:transparent;color:inherit;font:inherit;padding:0}
.editbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-8px 0 18px;font-size:12.5px;color:var(--muted)}
.editbar .icon-btn{font-weight:500}
.editbar .add{border-color:var(--accent);color:var(--accent)}
.ehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.dsgrid button{text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px}
.dsgrid button:hover{border-color:var(--accent)}
.dsgrid .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.eitem{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:8px 0}
.eitem>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 12px;font-weight:600}
.eitem>summary::-webkit-details-marker{display:none}
.eitem>summary .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eitem>summary:before{content:"\25B8";color:var(--muted);font-size:12px}
.eitem[open]>summary:before{content:"\25BE"}
.eitem>.eb{padding:4px 12px 12px;border-top:1px solid var(--line)}
.eitem .eitem{background:var(--bg)}
.ef{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0}
.ef>.el{font-size:12.5px;color:var(--muted);font-weight:500;padding-top:8px}
.ef input[type=text],.ef input[type=number],.ef input[type=url],.ef select,.ef textarea,.erow input,.erow select,.erow textarea{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.ef textarea,.erow textarea{min-height:64px;resize:vertical}
.ef input[type=checkbox]{width:17px;height:17px;margin-top:8px;accent-color:var(--accent)}
.efs{border:1px dashed var(--line);border-radius:10px;padding:6px 12px 10px;margin:6px 0}
.efs>legend{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 6px}
.elist{display:flex;flex-direction:column;gap:6px}
.erow{display:flex;gap:6px;align-items:flex-start}
.erow>.grow{flex:1;min-width:0;display:flex;gap:6px;flex-wrap:wrap}
.erow>.grow>*{flex:1 1 160px}
.erow .k{flex:0 0 220px}
.erow .acts{display:flex;gap:4px;flex:0 0 auto}
.erow .acts .icon-btn,.eitem summary .icon-btn{padding:3px 8px}
.echips{display:flex;flex-wrap:wrap;gap:6px}
.echips label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;background:var(--surface)}
.echips label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.echips input{margin:0;accent-color:var(--accent)}
.eadd{margin-top:6px}
.ebar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:18px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ebar .msg{margin-right:auto;font-size:13px;color:var(--muted)}
.ebar.dirty{border-color:var(--amber)}
.ebar.dirty .msg{color:var(--amber);font-weight:600}
.eerr{border:1px solid var(--crit);color:var(--crit);border-radius:10px;padding:10px 14px;margin:12px 0;font-size:13.5px}
.ehint{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.egroup{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
@media (max-width:700px){
  .ef{grid-template-columns:1fr;gap:4px}
  .ef>.el{padding-top:0}
  .erow{flex-wrap:wrap}
  .erow .k{flex:1 1 100%}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script id="app-js">
(function(){
"use strict";
var TITLE = "Electrical Industry Explorer";
var FONT_LINKS = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">';

  if (saveState==="ok") return "<b>Edits save to HireLab.</b><br>Everyone in your agency sees them.";

function persist(){
  try { localStorage.setItem("eie-view", location.hash || "#overview"); } catch(e){}

  setSave("pending");
  clearTimeout(saveTimer);

    setSave("saving");
    artifactApi.publish(buildDoc()).then(function(){ setSave("ok"); }).catch(function(e){
      var code = e && (e.code || e.name || e.message) || "";
      if (/not_granted|not_writer/.test(String(code))) setSave("readonly");

}

  var h = '<h1>'+t("ov_h1")+'</h1><p class="lead">'+t("ov_lead")+'</p>';
  h += '<div class="sec"><div class="sec-head"><div><h2>'+t("ov_map_h")+'</h2><p>'+t("ov_map_p")+'</p></div>'+(ui.layer?'<button class="btn ghost" data-act="clearlayer">Clear selection</button>':'')+'</div><div class="card">';

  h += '<div class="map3"><div class="col"><div class="colh">What they make</div>' + LAYERS.map(function(l){ return '<button class="node '+(L? (L.id===l.id?"on":"dim") : "")+'" data-layer="'+l.id+'"><b>'+esc(l.n)+'</b><span>'+esc(l.d)+'</span></button>'; }).join("") + '</div>';
  h += '<div class="arrowcol" aria-hidden="true">→</div><div class="col"><div class="colh">How it is sold</div>' + ROUTES.map(function(r){ var on = L && L.routes.indexOf(r.id)>=0; return '<div class="node '+(L?(on?"on":"dim"):"")+'"><b>'+esc(r.n)+'</b><span>'+esc(r.d)+'</span></div>'; }).join("") + '</div>';
  h += '<div class="arrowcol" aria-hidden="true">→</div><div class="col"><div class="colh">Who uses it</div>' + CUST.map(function(c){ var on = L && L.cust.indexOf(c.id)>=0; return '<div class="node '+(L?(on?"on":"dim"):"")+'"><b>'+esc(c.n)+'</b><span>'+esc(c.d)+'</span></div>'; }).join("") + '</div>';
  h += '<div class="influ">'+t("ov_influ")+'</div></div>';
  if (L){
    var scores = MCOLS.map(function(id, ci){ var s=0; L.segs.forEach(function(sid){ var seg = SEGS.filter(function(x){return x.id===sid;})[0]; if (seg) s += rating(seg, ci); }); return {id:id, s:s}; }).filter(function(x){return x.s>0;}).sort(function(a,b){return b.s-a.s;});
    var max = L.segs.length*2;
    h += '<div class="result"><h3>Who is strong in '+esc(L.n.toLowerCase())+'</h3><p class="small muted" style="margin:4px 0 10px">Score across '+L.segs.length+' heatmap rows (Strong = 2, Present = 1). Your sourcing pool, best first.</p><div class="grid g4">' + scores.map(function(x){ var pct = Math.round(x.s/max*100); return '<button class="card peer" data-go="company-'+x.id+'"><b>'+esc(coName(x.id))+'</b><div style="height:8px;border-radius:4px;background:var(--bg);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--accent)"></div></div><span class="small muted mono">'+x.s+' / '+max+'</span></button>'; }).join("") + '</div></div>';
  }
  h += '</div></div>';
  h += '<div class="sec"><div class="sec-head"><div><h2>'+t("ov_big_h")+'</h2><p>'+t("ov_big_p")+'</p></div></div><div class="grid g4">';
  h += COS.filter(function(c){return c.big;}).map(function(c){ return '<button class="card cocard" style="border-top-color:var('+(c.color||"--co-peer")+')" data-go="company-'+c.id+'"><h3>'+esc(c.short)+'</h3><div class="tag">'+esc(c.tag)+'</div><ul>'+c.overview.map(function(o){return '<li>'+esc(o)+'</li>';}).join("")+'</ul><span class="small" style="color:var(--accent);font-weight:600">Open profile →</span></button>'; }).join("");
  h += '</div></div>';
  h += '<div class="sec"><div class="sec-head"><div><h2>'+t("ov_peers_h")+'</h2><p>'+t("ov_peers_p")+'</p></div></div><div class="grid g3">';
  h += CLUSTERS.map(function(cl){ var list = COS.filter(function(c){return c.cluster===cl.id;}); return '<div class="cluster"><h3>'+esc(cl.n)+'</h3><div class="grid" style="gap:8px">'+list.map(function(c){ return '<button class="card peer" data-go="company-'+c.id+'"><b>'+esc(c.name)+'</b><span class="small muted">'+esc(c.core)+'</span></button>'; }).join("")+'</div></div>'; }).join("");
  h += '</div></div>';
  h += callout("ov_callout");
  return h;
}

function siteMap(c){
  var W=340, H=380, x0=67, x1=98, y0=7, y1=37;
  function px(lon){ return 16+(lon-x0)/(x1-x0)*(W-32); }
  function py(lat){ return 16+(y1-lat)/(y1-y0)*(H-32); }
  var d = OUTLINE.map(function(p,i){ return (i?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1); }).join("")+"Z";
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Approximate map of '+esc(c.short)+' sites in India" style="width:100%;height:auto;max-width:380px">';
  svg += '<path d="'+d+'" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/>';
  Object.keys(CITY).forEach(function(k){ svg += '<circle cx="'+px(CITY[k][0]).toFixed(1)+'" cy="'+py(CITY[k][1]).toFixed(1)+'" r="2" fill="var(--line)"/>'; });
  var placed = [];
  var sites = c.sites.filter(function(s){ return CITY[s.c]; }).sort(function(a,b){ return CITY[b.c][1]-CITY[a.c][1]; });
  sites.forEach(function(s, i){
    var p = CITY[s.c]; if (!p) return;
    var x = px(p[0]), y = py(p[1]);
    var col = s.t==="rd"?"var(--amber)":s.t==="hq"?"var(--ink)":s.t==="new"?"var(--good)":s.t==="tc"?"var(--muted)":"var(--accent)";
    var shape = s.t==="rd" ? '<rect x="'+(x-5)+'" y="'+(y-5)+'" width="10" height="10" rx="2" fill="'+col+'"/>' : s.t==="tc" ? '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="var(--surface)" stroke="'+col+'" stroke-width="2"/>' : '<circle cx="'+x+'" cy="'+y+'" r="5.5" fill="'+col+'" stroke="var(--surface)" stroke-width="1.5"/>';
    var left = x > W*0.62;
    var lx = left ? x-9 : x+9, ly = y+4;
    placed.forEach(function(q){ if (Math.abs(q.x-lx)<80 && Math.abs(q.y-ly)<12 && q.left===left) ly = q.y+12; });
    placed.push({x:lx,y:ly,left:left});
    svg += '<g class="mk" data-site="'+i+'">'+shape+'<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" font-size="11" fill="var(--ink)" text-anchor="'+(left?"end":"start")+'" style="paint-order:stroke;stroke:var(--surface);stroke-width:3px">'+esc(s.c)+'</text></g>';
  });
  svg += '</svg>';
  return svg;
}

    h += '<div class="sec"><h2>'+t("co_bus_h")+'</h2><p class="small muted" style="margin:0 0 12px">'+t("co_bus_p")+'</p><div class="grid g3">'+c.bus.map(function(b){ return '<div class="card bu"><h3>'+esc(b.n)+'</h3><div class="small">'+esc(b.p)+'</div><div class="who"><b>Buyer:</b> '+esc(b.w)+'</div></div>'; }).join("")+'</div></div>';
    h += '<div class="sec"><h2>'+t("co_sites_h")+'</h2><p class="small muted" style="margin:0 0 12px">'+t("co_sites_p")+'</p><div class="card foot"><div>'+siteMap(c)+'</div><div><div class="legend" style="margin-bottom:10px"><span><span class="sym hq" style="display:inline-block;vertical-align:-2px;margin-right:5px"></span>HQ</span><span><span class="sym" style="display:inline-block;vertical-align:-2px;margin-right:5px"></span>Plant / office</span><span><span class="sym new" style="display:inline-block;vertical-align:-2px;margin-right:5px"></span>New plant</span><span><span class="sym rd" style="display:inline-block;vertical-align:-2px;margin-right:5px"></span>R&amp;D</span><span><span class="sym tc" style="display:inline-block;vertical-align:-2px;margin-right:5px"></span>Training centre</span></div><div class="sites">'+c.sites.map(function(s){ var cls = s.t==="hq"?"hq":s.t==="rd"?"rd":s.t==="new"?"new":s.t==="tc"?"tc":""; return '<div class="site"><span class="sym '+cls+'"></span><div><b>'+esc(s.c)+'</b> <span class="muted">'+esc(s.n)+'</span> '+(s.v?'<span class="pill verify">verify</span>':'')+(s.s?' <span class="src">'+srcLink(s.s)+'</span>':'')+'</div></div>'; }).join("")+'</div></div></div></div>';
    h += '<div class="sec"><h2>'+t("co_tl_h")+'</h2><div class="card"><div class="tl">'+c.tl.map(function(t){ return '<div class="step"><div class="yr">'+esc(t.y)+'</div><div class="tx">'+esc(t.t)+'</div></div>'; }).join("")+'</div></div></div>';

    var ci2 = MCOLS.indexOf(id);
    if (ci2>=0){ var st = SEGS.filter(function(sg){return rating(sg,ci2)===2;}), pr = SEGS.filter(function(sg){return rating(sg,ci2)===1;}); h += '<div class="sec card"><div class="sec-head" style="margin-bottom:6px"><h3>Where '+esc(c.short)+' is strong (heatmap)</h3><a class="small" href="#matrix">Open heatmap</a></div><div class="chips">'+st.map(function(sg){return '<span class="pill strong">'+esc(sg.n.split(" (")[0])+'</span>';}).join("")+pr.map(function(sg){return '<span class="pill present">'+esc(sg.n.split(" (")[0])+'</span>';}).join("")+'</div><p class="small muted" style="margin:8px 0 0">Dark = Strong, light = Present. Competitors in the same segments are your sourcing pool.</p></div>'; }
  }
  h += '<div class="sec"><div class="sec-head"><div><h2>Your learnings</h2><p>From your learning log, tagged '+esc(c.short)+'.</p></div><button class="btn ghost" data-addlog="'+id+'">Add a learning</button></div><div class="card">'+(mylog.length? '<div class="learn">'+mylog.map(function(e){ return '<div class="lrow"><span class="mono small muted">'+esc(e.date)+'</span><div>'+esc(e.text)+'<div class="small muted">'+esc(e.bu||"")+(e.from?" · "+esc(e.from):"")+'</div></div><span class="pill '+(e.conf===2?"strong":e.conf===1?"present":"")+'">'+["Heard once","Confirmed 2+","Verified"][e.conf||0]+'</span></div>'; }).join("")+'</div>' : '<p class="small muted" style="margin:0">Nothing yet. Add what you hear on your next call with someone from '+esc(c.short)+'.</p>')+'</div></div>';
  return h;

function vMatrix(){
  var h = '<h1>'+t("mx_h1")+'</h1><p class="lead">'+t("mx_lead")+'</p>';
  h += '<div class="sec sec-head" style="margin-top:20px"><div class="legend"><span><i style="background:var(--accent)"></i>Strong: top-3, deep team</span><span><i style="background:var(--accent-soft)"></i>Present: smaller team</span><span><i style="border:1px solid var(--line)"></i>Not a real player</span><span><i style="box-shadow:0 0 0 2px var(--amber) inset"></i>Edited by you</span></div><label class="switch"><input type="checkbox" id="editM" '+(ui.editM?"checked":"")+'> Edit ratings (click a cell to change it)</label></div>';
  h += '<div class="card scroll"><table class="hm'+(ui.editM?" editing":"")+'"><thead><tr><th></th>'+MGROUPS.map(function(g){ return '<th colspan="'+g.c.length+'" class="grp">'+esc(g.n)+'</th>'; }).join("")+'</tr><tr><th></th>'+MCOLS.map(function(id){ return '<th class="colh"><button data-go="company-'+id+'">'+esc(coName(id))+'</button></th>'; }).join("")+'</tr></thead><tbody>';
  h += SEGS.map(function(s){ return '<tr><th class="rowh'+(ui.seg===s.id?" on":"")+'"><button data-seg="'+s.id+'">'+esc(s.n)+'</button></th>'+MCOLS.map(function(id,ci){ var r = rating(s,ci); return '<td><div class="cell s'+r+(edited(s,ci)?" edited":"")+'" data-cell="'+s.id+'|'+ci+'" title="'+esc(coName(id)+" · "+s.n)+'">'+(r===2?"Strong":r===1?"Present":"–")+'</div></td>'; }).join("")+'</tr>'; }).join("");
  h += '</tbody></table></div>';
  if (ui.seg){
    var s = SEGS.filter(function(x){return x.id===ui.seg;})[0];
    var strong = MCOLS.filter(function(id,ci){return rating(s,ci)===2;}), present = MCOLS.filter(function(id,ci){return rating(s,ci)===1;});
    h += '<div class="sec card"><h3>Sourcing pool: '+esc(s.n)+'</h3>'+(SEGNOTE[s.id]?'<p class="small muted">'+esc(SEGNOTE[s.id])+'</p>':'')+'<div class="grid g2" style="margin-top:10px"><div><div class="small muted" style="margin-bottom:6px">Primary pool (Strong)</div><div class="chips">'+(strong.map(coLink).join("")||'<span class="muted small">None</span>')+'</div></div><div><div class="small muted" style="margin-bottom:6px">Secondary pool (Present, often want a bigger platform)</div><div class="chips">'+(present.map(coLink).join("")||'<span class="muted small">None</span>')+'</div></div></div></div>';
  }
  if (Object.keys(STATE.matrix).length) h += '<p class="small muted">'+Object.keys(STATE.matrix).length+' rating(s) changed by you. <button class="icon-btn" data-act="resetm">Reset to original</button></p>';
  h += ''+(TEXT.mx_note0?'<p class="small muted">'+t("mx_note0")+'</p>':'')+'<p class="small muted">'+t("mx_note")+'</p>';
  return h;
}

function vTalent(){

  var R = ui.role ? ROLES.filter(function(r){return r.id===ui.role;})[0] : null;
  var h = '<h1>'+t("tm_h1")+'</h1><p class="lead">'+t("tm_lead")+'</p>';

  h += '<g fill="none" stroke="var(--muted)" stroke-width="1.5"><path d="M236 114H274" marker-start="url(#ar)" marker-end="url(#ar)"/><path d="M486 114H524" marker-start="url(#ar)" marker-end="url(#ar)" stroke-dasharray="5 5"/><path d="M318 158V250" marker-start="url(#ar)" marker-end="url(#ar)"/><path d="M442 158V250" marker-start="url(#ar)" marker-end="url(#ar)" stroke-dasharray="5 5"/></g>';
  h += '<text x="255" y="104" text-anchor="middle" font-size="12" fill="var(--muted)">easy</text><text x="505" y="104" text-anchor="middle" font-size="12" fill="var(--muted)">rare</text><text x="308" y="208" text-anchor="end" font-size="12" fill="var(--muted)">common for key accounts</text><text x="452" y="208" font-size="12" fill="var(--muted)">MV people only</text>';
  POOLS.forEach(function(p){

    var ink = first ? "#fff" : "var(--ink)", sub = first ? "#fff" : "var(--muted)";

function vRoles(){
  var P = pay();
  var h = '<h1>'+t("ro_h1")+'</h1><p class="lead">'+t("ro_lead")+'</p>';
  h += '<div class="sec"><h2>'+t("ro_roles_h")+'</h2><p class="small muted" style="margin:0 0 12px">'+t("ro_roles_p")+'</p><div class="grid g4">'+ROLES.map(function(r){ return '<button class="card role" data-rolego="'+r.id+'"><h3>'+esc(r.n)+'</h3><div class="m"><span class="muted">Sells to</span><br>'+esc(r.to)+'</div><div class="m"><span class="muted">Success</span><br>'+esc(r.ok)+'</div><div class="m"><span class="muted">Best bench</span><div class="chips" style="margin-top:4px">'+r.bench.map(function(id){ return '<span class="chip">'+esc(coName(id))+'</span>'; }).join("")+'</div></div></button>'; }).join("")+'</div></div>';
  var ticks=[5,10,20,50,100,150], lo=3, hi=170, X0=250, X1=730;
  function sx(v){ return X0 + (Math.log(v)-Math.log(lo))/(Math.log(hi)-Math.log(lo))*(X1-X0); }
  var H = 60 + P.length*44;
  var svg = '<svg viewBox="0 0 760 '+H+'" role="img" aria-label="Fixed CTC bands by level, rupees lakh per year" style="width:100%;height:auto">';
  ticks.forEach(function(t){ svg += '<line x1="'+sx(t).toFixed(1)+'" x2="'+sx(t).toFixed(1)+'" y1="30" y2="'+(H-20)+'" stroke="var(--line)"/><text x="'+sx(t).toFixed(1)+'" y="22" text-anchor="middle" font-size="12" fill="var(--muted)" class="mono">'+t+'</text>'; });
  svg += '<text x="'+X1+'" y="'+(H-4)+'" text-anchor="end" font-size="11.5" fill="var(--muted)">Rs lakh per year, fixed CTC (log scale)</text>';
  P.forEach(function(p,i){
    var y = 52 + i*44, a = sx(Math.max(lo,p.lo)), b = sx(Math.min(hi,p.hi));
    svg += '<text x="16" y="'+(y-3)+'" font-size="13" font-weight="600" fill="var(--ink)">'+esc(p.l)+' · '+esc(p.e)+'</text><text x="16" y="'+(y+13)+'" font-size="11.5" fill="var(--muted)">'+esc(p.t)+'</text>';
    svg += '<rect x="'+a.toFixed(1)+'" y="'+(y-9)+'" width="'+Math.max(4,b-a).toFixed(1)+'" height="18" rx="9" fill="var(--accent)" fill-opacity="'+(0.35+i*0.11).toFixed(2)+'"/>';
    svg += '<text x="'+(a-6).toFixed(1)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="var(--ink)" class="mono">'+p.lo+'</text><text x="'+(b+6).toFixed(1)+'" y="'+(y+4)+'" font-size="12" fill="var(--ink)" class="mono">'+p.hi+(p.hi>=150?"+":"")+'</text>';
  });
  svg += '</svg>';
  h += '<div class="sec"><div class="sec-head"><div><h2>'+t("ro_pay_h")+'</h2><p>'+t("ro_pay_p")+'</p></div><label class="switch"><input type="checkbox" id="editP" '+(ui.editP?"checked":"")+'> Edit bands with real offers</label></div><div class="card">'+svg;
  if (ui.editP){
    h += '<div class="scroll ladder" style="margin-top:12px"><table><thead><tr><th style="text-align:left;padding:6px">Level</th><th style="text-align:left;padding:6px">Titles</th><th style="padding:6px">Low (Rs L)</th><th style="padding:6px">High (Rs L)</th></tr></thead><tbody>'+P.map(function(p,i){ return '<tr><td style="padding:6px"><b>'+esc(p.l)+'</b></td><td style="padding:6px" class="small">'+esc(p.t)+'</td><td style="padding:6px;text-align:center"><input type="number" min="1" max="500" id="plo'+i+'" value="'+p.lo+'"></td><td style="padding:6px;text-align:center"><input type="number" min="1" max="500" id="phi'+i+'" value="'+p.hi+'"></td></tr>'; }).join("")+'</tbody></table><div style="display:flex;gap:8px;margin-top:10px"><button class="btn" data-act="savepay">Save bands</button>'+(STATE.pay?'<button class="btn ghost" data-act="resetpay">Reset to estimates</button>':'')+'</div></div>';
  }
  h += '</div></div>';
  h += '<div class="sec"><h2>'+t("ro_funcs_h")+'</h2><div class="grid g4" style="margin-top:10px">'+FUNCS.map(function(f){ return '<div class="card"><h3>'+esc(f[0])+'</h3><p class="small" style="margin:6px 0">'+esc(f[1])+'</p><p class="small muted" style="margin:0">'+esc(f[2])+'</p></div>'; }).join("")+'</div></div>';
  return h;
}

function vTrends(){
  var h = '<h1>'+t("tr_h1")+'</h1><p class="lead">'+t("tr_lead")+'</p>';
  h += '<div class="sec grid g3">'+TRENDS.map(function(t,i){ return '<div class="card trend"><div class="num">'+String(i+1).padStart(2,"0")+' / '+String(TRENDS.length).padStart(2,"0")+'</div><h3>'+esc(t.n)+'</h3><p class="small" style="margin:0">'+esc(t.w)+' <span class="src">'+srcLink(t.s)+'</span></p><div><div class="small muted" style="margin-bottom:4px">Roles that open</div><div class="chips">'+t.roles.map(function(r){return '<span class="chip">'+esc(r)+'</span>';}).join("")+'</div></div><div><div class="small muted" style="margin-bottom:4px">Companies to watch</div><div class="chips">'+t.cos.map(coLink).join("")+'</div></div></div>'; }).join("")+'</div>';
  h += callout("tr_callout");
  return h;
}

function vGlossary(){
  var groups = ["All"]; GLOSS.forEach(function(g){ if (g[0] && groups.indexOf(g[0])<0) groups.push(g[0]); });
  var q = ui.gq.toLowerCase();
  var list = GLOSS.filter(function(g){ return (ui.gg==="All"||g[0]===ui.gg) && (!q || (g[1]+" "+g[2]+" "+g[3]).toLowerCase().indexOf(q)>=0); });
  var h = '<h1>'+t("gl_h1")+'</h1><p class="lead">'+t("gl_lead")+'</p>';
  h += '<div class="sec" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><input class="search" id="gq" type="search" placeholder="Search a term, e.g. ACB or panel builder" value="'+esc(ui.gq)+'" aria-label="Search glossary"><div class="chips">'+groups.map(function(g){ return '<button class="chip'+(ui.gg===g?" on":"")+'" data-gg="'+esc(g)+'">'+esc(g)+'</button>'; }).join("")+'</div></div>';
  h += '<div class="sec grid g3" id="glist">'+glossCards(list)+'</div>';
  return h;
}
function glossCards(list){
  if (!list.length) return '<p class="muted">No term matches. Try a shorter word.</p>';
  return list.map(function(g){ return '<div class="card term"><span class="pill">'+esc(g[0])+'</span><b>'+esc(g[1])+'</b><span class="small">'+esc(g[2])+'</span><span class="small muted">Shows up in: '+esc(g[3])+'</span></div>'; }).join("");
}

function vCallkit(){
  var tabs = Object.keys(QS);
  if (!QS[ui.qtab]) ui.qtab = tabs[0] || "";
  if (!tabs.length) return '<h1>'+t("ck_h1")+'</h1><p class="lead">No questions yet. <a href="#edit/QS">Add some</a>.</p>';
  var h = '<h1>'+t("ck_h1")+'</h1><p class="lead">'+t("ck_lead")+'</p>';
  h += '<div class="sec chips">'+tabs.map(function(t){ return '<button class="chip'+(ui.qtab===t?" on":"")+'" data-qtab="'+esc(t)+'">'+esc(t)+'</button>'; }).join("")+'</div>';
  h += '<div class="sec grid g2"><div class="card"><h3>'+esc(ui.qtab)+'</h3>'+QS[ui.qtab].map(function(q,i){ return '<label class="q"><input type="checkbox" id="q'+i+'"><span>'+esc(q)+'</span></label>'; }).join("")+'</div><div class="card" style="border-left:4px solid var(--crit)"><h3>Red flags</h3>'+REDFLAGS.map(function(r){ return '<div class="q"><span style="color:var(--crit);font-weight:700">!</span><span>'+esc(r)+'</span></div>'; }).join("")+'<p class="small muted" style="margin-top:12px">Heard something new? <a href="#log">Add it to the learning log</a>.</p></div></div>';
  return h;
}

function vLog(){
  var e = ui.editId ? STATE.log.filter(function(x){return x.id===ui.editId;})[0] : null;
  var pre = e || {date:today(), co:ui.prefillCo||"schneider", bu:"", from:"", text:"", conf:0, moved:false};
  var opts = COS.map(function(c){ return '<option value="'+c.id+'"'+(pre.co===c.id?" selected":"")+'>'+esc(c.name)+'</option>'; }).join("") + '<option value="general"'+(pre.co==="general"?" selected":"")+'>General / industry</option>';
  var h = '<h1>'+t("lg_h1")+'</h1><p class="lead">'+t("lg_lead")+'</p>';
  if (saveState==="readonly") h += '<div class="banner">Saving is not available in this view, so entries you add here disappear when you reload. Sign in to HireLab to keep them.</div>';
  h += '<div class="sec card"><h3>'+(e?"Edit entry":"Add a learning")+'</h3><form class="form" id="logform" style="margin-top:10px"><label>Date<input type="date" id="f-date" value="'+esc(pre.date)+'" required></label><label>Company<select id="f-co">'+opts+'</select></label><label>BU / team<input id="f-bu" value="'+esc(pre.bu)+'" placeholder="e.g. Secure Power"></label><label>Heard from (role, not name)<input id="f-from" value="'+esc(pre.from)+'" placeholder="e.g. KAM, 9 yrs"></label><label class="wide">What you learned<textarea id="f-text" required placeholder="e.g. Schneider and L&K channel teams merged in North zone in 2026">'+esc(pre.text)+'</textarea></label><label>Confidence<select id="f-conf"><option value="0"'+(pre.conf===0?" selected":"")+'>Heard once</option><option value="1"'+(pre.conf===1?" selected":"")+'>Confirmed by 2+</option><option value="2"'+(pre.conf===2?" selected":"")+'>Verified (public source)</option></select></label><label>Moved into playbook<select id="f-moved"><option value="0"'+(!pre.moved?" selected":"")+'>Not yet</option><option value="1"'+(pre.moved?" selected":"")+'>Done</option></select></label><div style="display:flex;gap:8px;align-items:flex-end" class="wide"><button class="btn" type="submit">'+(e?"Save changes":"Add entry")+'</button>'+(e?'<button class="btn ghost" type="button" data-act="canceledit">Cancel</button>':'')+'</div></form></div>';
  var list = STATE.log.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; }).filter(function(x){ return ui.logco==="all" || x.co===ui.logco; });
  var used = {}; STATE.log.forEach(function(x){ used[x.co]=1; });
  h += '<div class="sec"><div class="sec-head"><div><h2>Entries <span class="muted mono" style="font-size:16px">'+list.length+'</span></h2></div><div class="chips"><button class="chip'+(ui.logco==="all"?" on":"")+'" data-logco="all">All</button>'+Object.keys(used).map(function(id){ return '<button class="chip'+(ui.logco===id?" on":"")+'" data-logco="'+id+'">'+esc(id==="general"?"General":coName(id))+'</button>'; }).join("")+'</div></div><div class="card">';
  h += list.length ? list.map(function(x){ return '<div class="entry"><span class="mono small muted">'+esc(x.date)+'</span><div>'+(x.co==="general"?'<span class="chip">General</span>':coLink(x.co))+'<div class="small muted" style="margin-top:4px">'+esc(x.bu||"")+'</div></div><div>'+esc(x.text)+'<div class="small muted" style="margin-top:4px">'+(x.from?esc(x.from)+" · ":"")+'<span class="pill '+(x.conf===2?"strong":x.conf===1?"present":"")+'">'+["Heard once","Confirmed 2+","Verified"][x.conf||0]+'</span> '+(x.moved?'<span class="pill">In playbook</span>':'')+'</div></div><div class="acts"><button class="icon-btn" data-edit="'+esc(x.id)+'">Edit</button><button class="icon-btn" data-del="'+esc(x.id)+'">Delete</button></div></div>'; }).join("") : '<p class="muted small" style="margin:0">No entries yet.</p>';
  h += '</div></div>';
  return h;
}

/* ---------- render + events ---------- */
function currentView(){ var h = decodeURIComponent((location.hash||"").replace(/^#/,"")); if (!h) return "overview"; if (h==="edit" || h.indexOf("edit/")===0) return h; if (h.indexOf("company-")===0 && CO[h.slice(8)]) return h; return VIEWS.some(function(v){return v[0]===h;}) ? h : "overview"; }
var pendingDel = null;
function render(){
  var v = currentView(), inner;
  if (v.indexOf("edit")===0) inner = vEdit(v);
  else if (v.indexOf("company-")===0) inner = vCompany(v.slice(8));
  else inner = {overview:vOverview, matrix:vMatrix, talent:vTalent, roles:vRoles, trends:vTrends, glossary:vGlossary, callkit:vCallkit, log:vLog}[v]();
  document.getElementById("app").innerHTML = shell(inner, v);
  var tt = document.title; if (tt !== TITLE) document.title = TITLE;
  ui.lastView = location.hash || "#overview";
  if (ui.scrollTo !== undefined && ui.scrollTo !== null){ var si = ui.scrollTo; ui.scrollTo = null; setTimeout(function(){ var el = document.querySelector('.eitem[data-ei="'+si+'"]'); if (el) el.scrollIntoView({block:"start"}); }, 30); }
}
function go(hash){ if (location.hash === "#"+hash) { render(); window.scrollTo(0,0); } else { location.hash = hash; } }

document.addEventListener("click", function(ev){
  var ea = ev.target.closest("[data-eact]");
  if (ea){ ev.preventDefault(); editAction(ea); return; }
  var el = ev.target.closest("[data-go],[data-layer],[data-act],[data-seg],[data-cell],[data-pool],[data-role],[data-rolego],[data-gg],[data-qtab],[data-logco],[data-edit],[data-del],[data-addlog]");
  if (!el) return;
  var d = el.dataset;
  if (d.go){ ev.preventDefault(); go(d.go); return; }
  if (d.layer){ ui.layer = ui.layer===d.layer ? null : d.layer; render(); return; }
  if (d.seg){ ui.seg = ui.seg===d.seg ? null : d.seg; render(); return; }
  if (d.cell !== undefined){
    if (!ui.editM){ var p0 = d.cell.split("|"); ui.seg = p0[0]; render(); return; }
    var p = d.cell.split("|"), seg = SEGS.filter(function(s){return s.id===p[0];})[0], ci = +p[1];
    var nv = (rating(seg,ci)+2)%3; var k = p[0]+"|"+MCOLS[ci];
    if (nv === (seg.r[MCOLS[ci]]||0)) delete STATE.matrix[k]; else STATE.matrix[k] = nv;
    persist(); return;
  }
  if (d.pool){ ui.pool = d.pool; render(); return; }
  if (d.role !== undefined && el.classList.contains("chip")){ ui.role = d.role || null; if (ui.role){ var r = ROLES.filter(function(x){return x.id===ui.role;})[0]; if (r && r.pools[0]) ui.pool = r.pools[0]; } render(); return; }
  if (d.rolego){ ui.role = d.rolego; var r1 = ROLES.filter(function(x){return x.id===d.rolego;})[0]; if (r1 && r1.pools[0]) ui.pool = r1.pools[0]; go("talent"); return; }
  if (d.gg){ ui.gg = d.gg; render(); return; }
  if (d.qtab){ ui.qtab = d.qtab; render(); return; }
  if (d.logco){ ui.logco = d.logco; render(); return; }
  if (d.addlog){ ui.prefillCo = d.addlog; ui.editId = null; go("log"); return; }
  if (d.edit){ ui.editId = d.edit; render(); window.scrollTo(0,0); return; }
  if (d.del){
    if (pendingDel === d.del){ STATE.log = STATE.log.filter(function(x){return x.id!==d.del;}); pendingDel = null; persist(); }
    else { pendingDel = d.del; el.textContent = "Click again to delete"; el.style.borderColor = "var(--crit)"; el.style.color = "var(--crit)"; setTimeout(function(){ if (pendingDel===d.del){ pendingDel=null; render(); } }, 3000); }
    return;
  }
  if (d.act==="clearlayer"){ ui.layer=null; render(); return; }
  if (d.act==="resetm"){ STATE.matrix = {}; persist(); return; }
  if (d.act==="canceledit"){ ui.editId=null; render(); return; }
  if (d.act==="savepay"){
    var np = PAY0.map(function(p,i){ var lo = parseFloat($("#plo"+i).value), hi = parseFloat($("#phi"+i).value); if (!(lo>0)) lo = p.lo; if (!(hi>0)) hi = p.hi; if (hi<lo){ var t=hi; hi=lo; lo=t; } return {l:p.l,t:p.t,e:p.e,lo:lo,hi:hi}; });
    STATE.pay = np; ui.editP = false; persist(); return;
  }
  if (d.act==="resetpay"){ STATE.pay = null; ui.editP=false; persist(); return; }
});

function editAction(el){
  var a = el.dataset.eact, lp = el.dataset.lp ? JSON.parse(el.dataset.lp) : null, i = +el.dataset.i;
  if (a==="save"){ saveDraft(); return; }
  if (a==="discard"){ ui.ek = null; ui.dirty = false; ui.err = ""; render(); return; }
  if (a==="reset"){
    if (el.dataset.sure!=="1"){ el.dataset.sure = "1"; el.textContent = "Click again to reset"; el.style.borderColor = "var(--crit)"; el.style.color = "var(--crit)"; return; }
    resetDs(ui.ek); return;
  }
  if (a==="addkey"){
    var o = ui.draft, base = ui.ek==="QS" ? "New tab" : ui.ek==="CITY" ? "New city" : ui.ek==="SEGNOTE" ? ((SEGS.filter(function(s){ return !(s.id in o); })[0]||{}).id || "row") : ui.ek==="POOLLINES" ? ((POOLS.filter(function(p){ return !(p.id in o); })[0]||{}).id || "pool") : "new";
    var nk = base, j = 2; while (nk in o) nk = base+" "+(j++);
    o[nk] = ui.ek==="QS" ? [""] : ui.ek==="CITY" ? [78, 21] : "";
    markDirty(); render(); return;
  }
  if (a==="delkey"){ delete ui.draft[el.dataset.key]; markDirty(); render(); return; }
  var list = getAt(ui.draft, lp); if (!Array.isArray(list)) return;
  if (a==="add" || a==="addpeer"){
    var tp = a==="addpeer" ? CO_PEER : listTpl(lp), item = clone(tp==null ? "" : tp);
    if (ui.ek==="COS" && lp.length===0 && CLUSTERS[0]) item.cluster = CLUSTERS[0].id;
    if (ui.ek==="MCOLS" && lp.length===0){ var free = COS.filter(function(c){ return list.indexOf(c.id)<0; })[0]; item = free ? free.id : ""; }
    if (ui.ek==="SEGS" && lp.length===0) item.r = {};
    list.push(item);
    if (item && typeof item==="object" && !Array.isArray(item)) ui.open[JSON.stringify(lp.concat([list.length-1]))] = true;
    markDirty(); render();
    var fs = document.querySelectorAll('[data-lp="'+CSS.escape(JSON.stringify(lp))+'"][data-eact="del"]'); if (fs.length){ var last = fs[fs.length-1].closest(".eitem,.erow"); if (last){ last.scrollIntoView({block:"nearest"}); var f = last.querySelector("input:not([type=checkbox]),textarea,select"); if (f) f.focus(); } }
    return;
  }
  if (a==="del"){ list.splice(i,1); ui.open = {}; markDirty(); render(); return; }
  if (a==="up" && i>0){ var x = list[i]; list[i] = list[i-1]; list[i-1] = x; ui.open = {}; markDirty(); render(); return; }
  if (a==="down" && i<list.length-1){ var y = list[i]; list[i] = list[i+1]; list[i+1] = y; ui.open = {}; markDirty(); render(); return; }
}
function editInput(el){
  if (el.dataset.p){
    var p = JSON.parse(el.dataset.p), v;
    if (el.dataset.bool) v = el.checked; else if (el.dataset.num){ v = parseFloat(el.value); if (isNaN(v)) v = 0; } else v = el.value;
    setAt(ui.draft, p, v); markDirty();
    if (ui.ek==="COS" && p.length===2 && (p[1]==="big" || p[1]==="full")) render();
    return true;
  }
  if (el.dataset.ref){
    var rp = JSON.parse(el.dataset.ref), arr0 = getAt(ui.draft, rp);
    if (Array.isArray(arr0)){ var at = arr0.indexOf(el.value); if (el.checked && at<0) arr0.push(el.value); if (!el.checked && at>=0) arr0.splice(at,1); markDirty(); }
    return true;
  }
  if (el.dataset.rk !== undefined){
    var ok = el.dataset.rk, nk = el.value.trim(), o = ui.draft;
    if (!nk || nk===ok) return true;
    if (nk in o){ el.value = ok; return true; }
    var o2 = {}; Object.keys(o).forEach(function(x){ o2[x===ok?nk:x] = o[x]; }); ui.draft = o2;
    markDirty(); render(); return true;
  }
  return false;
}
document.addEventListener("toggle", function(ev){
  var d = ev.target; if (!d.classList || !d.classList.contains("eitem") || !d.dataset.ok) return;
  ui.open[d.dataset.ok] = d.open;
  var body = d.querySelector(":scope > .eb");
  if (d.open && body && !body.innerHTML){ var ip = JSON.parse(d.dataset.ok), it = getAt(ui.draft, ip); body.innerHTML = objEd(ip, it, tplFor(ip, it)); }
}, true);
document.addEventListener("keydown", function(ev){
  if ((ev.key==="Enter"||ev.key===" ") && ev.target.closest && ev.target.closest("[data-pool]")){ ev.preventDefault(); ui.pool = ev.target.closest("[data-pool]").dataset.pool; render(); }
});
document.addEventListener("change", function(ev){
  var tg = ev.target;
  if (tg.dataset && (tg.dataset.bool || tg.dataset.ref || tg.dataset.rk!==undefined || tg.tagName==="SELECT") && editInput(tg)) return;
  if (ev.target.id==="editM"){ ui.editM = ev.target.checked; render(); }
  if (ev.target.id==="editP"){ ui.editP = ev.target.checked; render(); }
});
document.addEventListener("input", function(ev){
  var ti = ev.target;
  if (ti.dataset && ti.dataset.p && !ti.dataset.bool && ti.tagName!=="SELECT"){ editInput(ti); return; }
  if (ev.target.id==="gq"){ ui.gq = ev.target.value; var q = ui.gq.toLowerCase(); var list = GLOSS.filter(function(g){ return (ui.gg==="All"||g[0]===ui.gg) && (!q || (g[1]+" "+g[2]+" "+g[3]).toLowerCase().indexOf(q)>=0); }); var gl = $("#glist"); if (gl) gl.innerHTML = glossCards(list); }
});
document.addEventListener("submit", function(ev){
  if (ev.target.id !== "logform") return;
  ev.preventDefault();
  var text = $("#f-text").value.trim(); if (!text) return;
  var rec = {date:$("#f-date").value||today(), co:$("#f-co").value, bu:$("#f-bu").value.trim(), from:$("#f-from").value.trim(), text:text, conf:+$("#f-conf").value, moved:$("#f-moved").value==="1"};
  if (ui.editId){ STATE.log = STATE.log.map(function(x){ if (x.id===ui.editId){ rec.id = x.id; return rec; } return x; }); ui.editId = null; }
  else { rec.id = "e"+Date.now().toString(36); STATE.log.push(rec); }
  ui.prefillCo = null;
  persist();
});
window.addEventListener("hashchange", function(){
  var nh = location.hash || "#overview";
  if (ui.dirty && ui.ek && nh.indexOf("#edit/"+ui.ek)!==0){
    if (!confirm("You have unsaved changes. Leave without saving?")){ history.replaceState(null, "", ui.lastView || "#edit/"+ui.ek); return; }
    ui.ek = null; ui.dirty = false;
  }
  render(); window.scrollTo(0,0); try { localStorage.setItem("eie-view", location.hash); } catch(e){} });

try { if (!location.hash){ var last = localStorage.getItem("eie-view"); if (last && last.length>1) history.replaceState(null, "", last); } } catch(e){}
render();
})();
</script>
