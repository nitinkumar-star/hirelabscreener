<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Company Talent Map · HireLab</title>
<style>
:root{--ink:#1F2328;--muted:#6B6F76;--line:#E3E1DA;--paper:#F7F6F2;--green:#0F6E56;--navy:#0E2A47;--blue:#1a73e8;--soft:#E6F4EE;--bar:#0F6E56;--bar2:#9DC9B8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper)}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top a.back{text-decoration:none;color:var(--muted);font-size:13px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.top h1{font-size:17px;margin:0}
.sp{flex:1}
.wrap{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.h{font-size:15px;font-weight:700;color:var(--navy);margin:0 0 4px}
.sub{color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.inp{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip:hover,.chip.on{border-color:var(--green);color:var(--green);background:var(--soft)}
.chip b{font-weight:700;margin-left:3px}
.opt{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.err{background:#FBE9E7;color:#B3261E;border-radius:10px;padding:10px 12px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.head h2{margin:0;font-size:24px;color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.br{display:grid;grid-template-columns:minmax(90px,170px) 1fr 52px;gap:8px;align-items:center;font-size:12.5px}
.br .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .t{background:#EFEDE7;border-radius:6px;height:12px;overflow:hidden}
.br .t i{display:block;height:100%;background:var(--bar);border-radius:6px}
.br .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.ns{cursor:default}
td{padding:9px 8px;border-bottom:1px solid #EFEDE7;vertical-align:top}
td .m{color:var(--muted);font-size:12px}
.tg{display:inline-block;font-size:11.5px;background:#EEF4FF;color:#3538CD;border-radius:6px;padding:1px 7px;margin:0 3px 3px 0}
.tg.g{background:#ECFDF3;color:#067647}
.tbar{display:flex;align-items:center;gap:6px;min-width:120px}
.tbar span{display:block;height:10px;background:var(--bar);border-radius:5px}
.fm{font-size:10.5px;background:#FFF6E5;color:#9A6512;border-radius:6px;padding:1px 6px;margin-left:5px}
.mu{color:var(--muted)}
.printhead{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 16px}
.tabs button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.ig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.big{font-size:30px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.small{display:inline-block;font-size:11px;background:#FFF6E5;color:#9A6512;border-radius:6px;padding:1px 7px}
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}
.mx td.z{color:#C9C6BD}
.tl{border-top:1px solid #EFEDE7;padding:8px 0;font-size:13px}.tl:first-child{border-top:0}
.sig{display:inline-block;font-size:11px;font-weight:700;background:var(--soft);color:var(--green);border-radius:6px;padding:1px 7px;margin-right:6px}
.qt{font-size:12.5px;color:#4A4740;border-left:3px solid var(--line);padding:2px 0 2px 9px;margin-top:6px}
@media(max-width:900px){.ig{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media print{
  body{background:#fff}
  .top,.noprint,#hln-btn{display:none !important}
  .wrap{max-width:none;padding:0}
  .card,.kpi{break-inside:avoid;border-color:#ddd}
  .printhead{display:block;margin-bottom:10px;font-size:12px;color:#555}
  a{color:inherit;text-decoration:none}
}
</style>
</head>
<body>
<div class="top"><a class="back" href="/">← App</a><div class="logo">H</div><h1>Company Talent Map</h1><div class="sp"></div>
  <a class="btn sm" href="/#central" style="text-decoration:none">Talent search</a></div>
<div class="wrap">
  <div class="card noprint">
    <div class="h">Pick a company</div>
    <div class="sub">See everyone you know there side by side — product handling, geography, yearly target, experience and CTC. Turn on <b>Client view</b> to hide names and contacts, then <b>Print / Save PDF</b> to share.</div>
    <div class="row" style="margin-top:10px">
      <input class="inp" id="q" list="cl" placeholder="Company name, e.g. KEI Wires" style="flex:1;min-width:220px" autocomplete="off">
      <datalist id="cl"></datalist>
      <button class="btn pri" id="go">Show talent</button>
    </div>
    <div class="chips" id="top"></div>
  </div>
  <div id="app"></div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
  function api(p){ return fetch('/api/talent-map' + p, {credentials: 'same-origin'}).then(function(r){ return r.json(); }).catch(function(e){ return {error: e.message}; }); }
  function ppl(n){ return n + (n === 1 ? ' person' : ' people'); }
  function num(v, d){ v = Number(v) || 0; return v ? (Math.round(v * 10) / 10).toLocaleString('en-IN') : (d || '—'); }
  var D = null, OPT = {former: false, client: false, hideCtc: false, sort: 'target', dir: -1, product: '', geo: '', tab: 'people'};
  var INTEL_ON = false, IC = {}, SIGF = '';          // Wave 2: Intelligence tab
  OPT.group = 'all';                                  // profile group shown on the People tab ('all' = today's view)
  try { if (new URLSearchParams(location.search).get('tab') === 'intel') OPT.tab = 'intel'; } catch(e) {}
  try { var s = JSON.parse(localStorage.getItem('tmap_opt') || '{}'); ['former', 'client', 'hideCtc'].forEach(function(k){ if (k in s) OPT[k] = !!s[k]; }); } catch(e) {}
  function saveOpt(){ try { localStorage.setItem('tmap_opt', JSON.stringify({former: OPT.former, client: OPT.client, hideCtc: OPT.hideCtc})); } catch(e) {} }

  async function loadCompanies(q){
    var r = await api('/companies?q=' + encodeURIComponent(q || ''));
    if (!r.ok) return [];
    $('cl').innerHTML = r.companies.map(function(c){ return '<option value="' + esc(c.name) + '">' + c.count + ' people</option>'; }).join('');
    return r.companies;
  }
  async function init(){
    try { var ic = await fetch('/api/talent-map/intel/config', {credentials: 'same-origin'}).then(function(r){ return r.json(); }); INTEL_ON = !!(ic && ic.ok && ic.on); } catch(e) { INTEL_ON = false; }
    if (!INTEL_ON) OPT.tab = 'people';
    var cs = await loadCompanies('');
    $('top').innerHTML = cs.slice(0, 16).map(function(c){ return '<button class="chip" data-n="' + esc(c.name) + '">' + esc(c.name) + '<b>' + c.count + '</b></button>'; }).join('');
    $('top').onclick = function(e){ var b = e.target.closest('[data-n]'); if (b) { $('q').value = b.dataset.n; show(b.dataset.n); } };
    var t; $('q').oninput = function(){ clearTimeout(t); var v = this.value; t = setTimeout(function(){ loadCompanies(v); }, 250); };
    $('q').onkeydown = function(e){ if (e.key === 'Enter') show(this.value); };
    $('go').onclick = function(){ show($('q').value); };
    var p = new URLSearchParams(location.search).get('company');
    if (p) { $('q').value = p; show(p); }
  }
  async function show(name){
    name = String(name || '').trim(); if (!name) return;
    $('app').innerHTML = '<div class="card empty">Loading…</div>';
    var r = await api('/company?former=1&view=' + (OPT.client ? 'client' : 'internal') + '&name=' + encodeURIComponent(name));
    if (!r.ok) { $('app').innerHTML = '<div class="card"><div class="err">' + esc(r.error || 'Could not load') + '</div></div>'; return; }
    D = r; OPT.product = ''; OPT.geo = '';
    D.groups = D.groups || [];
    if (OPT.group !== 'all' && +OPT.group !== 0 && !D.groups.some(function(g){ return g.id === +OPT.group; })) OPT.group = 'all';
    try { history.replaceState(null, '', '?company=' + encodeURIComponent(r.company) + (OPT.tab === 'intel' ? '&tab=intel' : '')); } catch(e) {}
    paint();
  }
  function inGroup(list){
    if (OPT.group === 'all') return list;
    var g = +OPT.group;
    return list.filter(function(p){ return (p.pgroup || 0) === g; });
  }
  function people(){
    var list = inGroup(D.people.concat(OPT.former ? D.former : []));
    if (OPT.product) list = list.filter(function(p){ return p.products.indexOf(OPT.product) >= 0; });
    if (OPT.geo) list = list.filter(function(p){ return p.geography.indexOf(OPT.geo) >= 0; });
    var k = OPT.sort, dir = OPT.dir;
    list = list.slice().sort(function(a, b){
      var x = a[k], y = b[k];
      if (k === 'name' || k === 'designation') { x = String(x || '').toLowerCase(); y = String(y || '').toLowerCase(); return x < y ? -dir : x > y ? dir : 0; }
      x = Number(x) || 0; y = Number(y) || 0;
      if (!x && y) return 1; if (x && !y) return -1;          // unknown last
      return (x - y) * dir;
    });
    return list;
  }
  function count(list, field){
    var m = {};
    list.forEach(function(p){ (p[field] || []).forEach(function(v){ m[v] = (m[v] || 0) + 1; }); });
    return Object.keys(m).map(function(k){ return [k, m[k]]; }).sort(function(a, b){ return b[1] - a[1] || (a[0] < b[0] ? -1 : 1); });
  }
  function bars(rows, max, fmt, click){
    if (!rows.length) return '<div class="sub" style="margin-top:8px">Not filled in yet for these people — add it on their profiles.</div>';
    return '<div class="bars">' + rows.map(function(r){
      return '<div class="br"' + (click ? ' data-' + click + '="' + esc(r[0]) + '" style="cursor:pointer" title="Show only these"' : '') + '><span class="l" title="' + esc(r[0]) + '">' + esc(r[0]) + '</span>'
        + '<span class="t"><i style="width:' + Math.max(3, Math.round(100 * r[1] / (max || 1))) + '%"></i></span><span class="v">' + (fmt ? fmt(r[1]) : r[1]) + '</span></div>';
    }).join('') + '</div>';
  }
  function band(e){ e = Number(e) || 0; return !e ? 'Not known' : e < 3 ? '0–3 yrs' : e < 6 ? '3–6 yrs' : e < 10 ? '6–10 yrs' : e < 15 ? '10–15 yrs' : '15+ yrs'; }
  function paint(){
    var list = people(), all = inGroup(D.people.concat(OPT.former ? D.former : []));
    var label = function(p, i){ return OPT.client ? 'Candidate ' + String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '') : p.name; };
    var exps = all.map(function(p){ return Number(p.experience) || 0; }).filter(Boolean);
    var ctcs = all.map(function(p){ return Number(p.ctc_current) || 0; }).filter(Boolean);
    var tg = all.map(function(p){ return Number(p.yearly_target) || 0; }).filter(Boolean);
    var prods = count(all, 'products'), geos = count(all, 'geography');
    var kp = [['People', String(all.length), D.people.length + ' current' + (OPT.former ? ' · ' + D.former.length + ' former' : '')],
      ['Avg experience', exps.length ? num(exps.reduce(function(a, b){ return a + b; }, 0) / exps.length) + ' yrs' : '—', exps.length + ' known'],
      ['CTC range', OPT.hideCtc ? 'Hidden' : (ctcs.length ? num(Math.min.apply(null, ctcs)) + '–' + num(Math.max.apply(null, ctcs)) + ' L' : '—'), 'per annum'],
      ['Yearly targets', tg.length ? '₹' + num(tg.reduce(function(a, b){ return a + b; }, 0)) + ' Cr' : '—', tg.length ? ppl(tg.length) + ' · top ₹' + num(Math.max.apply(null, tg)) + ' Cr' : 'add on profiles'],
      ['Team handled', (function(){ var t = all.reduce(function(a, p){ return a + (p.team_total || 0); }, 0); return t ? t + ' people' : '—'; })(), (function(){ var n = all.filter(function(p){ return p.team_total; }).length; return n ? 'across ' + ppl(n) : 'add on profiles'; })()],
      ['Top product', prods.length ? prods[0][0] : '—', prods.length ? ppl(prods[0][1]) : ''],
      ['Top geography', geos.length ? geos[0][0] : '—', geos.length ? ppl(geos[0][1]) : '']];
    var h = '<div class="printhead">Talent map prepared by HireLab · ' + new Date().toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'}) + '</div>'
      + '<div class="head"><div><div class="sub">Company talent map</div><h2>' + esc(D.company) + '</h2></div>'
      + '<div class="row noprint"><label class="opt"><input type="checkbox" id="o-former"' + (OPT.former ? ' checked' : '') + '> Include former employees (' + D.former.length + ')</label>'
      + '<label class="opt"><input type="checkbox" id="o-client"' + (OPT.client ? ' checked' : '') + '> Client view (hide names &amp; contacts)</label>'
      + '<label class="opt"><input type="checkbox" id="o-ctc"' + (OPT.hideCtc ? ' checked' : '') + '> Hide CTC</label>'
      + '<button class="btn sm" onclick="window.print()">&#128424; Print / Save PDF</button></div></div>';
    if (INTEL_ON) h += '<div class="tabs noprint" role="tablist"><button role="tab" data-tab="people" aria-selected="' + (OPT.tab !== 'intel') + '" class="' + (OPT.tab !== 'intel' ? 'on' : '') + '">People</button>'
      + '<button role="tab" data-tab="intel" aria-selected="' + (OPT.tab === 'intel') + '" class="' + (OPT.tab === 'intel' ? 'on' : '') + '">Intelligence</button></div>';
    if (INTEL_ON && OPT.tab === 'intel') { $('app').innerHTML = h + '<div id="intel"><div class="card empty">Loading company intelligence…</div></div>'; bind(); paintIntel(false); return; }
    h += groupChips();
    var gsel = OPT.group === 'all' ? null : (D.groups.filter(function(g){ return g.id === +OPT.group; })[0] || null);
    if (OPT.group !== 'all' && !(gsel && gsel.is_sales)) { paintGroup(h, gsel); return; }
    if (!all.length) { $('app').innerHTML = h + '<div class="card empty">Nobody from this company in your database yet' + (D.former.length ? ' — tick “Include former employees”.' : '.') + '</div>'; bind(); return; }
    h += '<div class="kpis">' + kp.map(function(k){ return '<div class="kpi"><span>' + k[0] + '</span><b title="' + esc(k[1]) + '">' + esc(k[1]) + '</b><span>' + esc(k[2]) + '</span></div>'; }).join('') + '</div>';
    var withT = all.filter(function(p){ return Number(p.yearly_target) > 0; }).sort(function(a, b){ return b.yearly_target - a.yearly_target; });
    var idx = {}; all.forEach(function(p, i){ idx[p.id] = i; });
    var bandsM = {}; all.forEach(function(p){ var b = band(p.experience); bandsM[b] = (bandsM[b] || 0) + 1; });
    var bandRows = ['0–3 yrs', '3–6 yrs', '6–10 yrs', '10–15 yrs', '15+ yrs', 'Not known'].filter(function(b){ return bandsM[b]; }).map(function(b){ return [b, bandsM[b]]; });
    h += '<div class="grid2">'
      + '<div class="card"><div class="h">Product handling</div><div class="sub">People per product line' + (OPT.product ? ' · showing <b>' + esc(OPT.product) + '</b> <a href="#" id="clrp" class="noprint">clear</a>' : ' · click a bar to filter') + '</div>' + bars(prods.slice(0, 12), prods.length ? prods[0][1] : 1, null, 'p') + '</div>'
      + '<div class="card"><div class="h">Geography handling</div><div class="sub">People per region / state' + (OPT.geo ? ' · showing <b>' + esc(OPT.geo) + '</b> <a href="#" id="clrg" class="noprint">clear</a>' : ' · click a bar to filter') + '</div>' + bars(geos.slice(0, 12), geos.length ? geos[0][1] : 1, null, 'g') + '</div>'
      + '<div class="card"><div class="h">Yearly target</div><div class="sub">₹ crore per person, highest first</div>'
      +   bars(withT.slice(0, 12).map(function(p){ return [label(p, idx[p.id]) + (p.designation ? ' · ' + p.designation : ''), p.yearly_target]; }), withT.length ? withT[0].yearly_target : 1, function(v){ return '₹' + num(v); }) + '</div>'
      + '<div class="card"><div class="h">Experience mix</div><div class="sub">How senior the team is</div>' + bars(bandRows, Math.max.apply(null, bandRows.map(function(b){ return b[1]; }).concat([1]))) + '</div>'
      + '</div>';
    var maxT = withT.length ? withT[0].yearly_target : 0;
    var th = function(k, l){ return '<th data-s="' + k + '">' + l + (OPT.sort === k ? (OPT.dir < 0 ? ' ▼' : ' ▲') : '') + '</th>'; };
    h += '<div class="card"><div class="row" style="justify-content:space-between"><div class="h">Side-by-side comparison</div><span class="sub">' + list.length + ' people' + (OPT.product || OPT.geo ? ' (filtered)' : '') + '</span></div><div class="scroll"><table><thead><tr>'
      + th('name', OPT.client ? 'Candidate' : 'Name') + th('designation', 'Designation') + th('experience', 'Exp') + '<th class="ns">Product handling</th><th class="ns">Geography</th>'
      + th('yearly_target', 'Yearly target') + th('team_total', 'Team') + (OPT.hideCtc ? '' : th('ctc_current', 'CTC')) + th('notice_period', 'Notice') + '<th class="ns">Location</th>'
      + (OPT.client ? '' : '<th class="ns noprint"></th>') + '</tr></thead><tbody>'
      + list.map(function(p){
          var i = idx[p.id];
          return '<tr><td><b>' + esc(label(p, i)) + '</b>' + (p.former ? '<span class="fm">Former' + (p.former_period ? ' · ' + esc(p.former_period) : '') + '</span>' : '')
            + (p.former && !OPT.client && p.current_company ? '<div class="m">Now: ' + esc([p.current_designation, p.current_company].filter(Boolean).join(' at ')) + '</div>' : '')
            + (!OPT.client && p.phone ? '<div class="m">' + esc(p.phone) + '</div>' : '') + '</td>'
            + '<td>' + esc(p.designation || '—') + (p.qualification ? '<div class="m">' + esc(p.qualification) + '</div>' : '') + '</td>'
            + '<td>' + (p.experience ? num(p.experience) + ' y' : '<span class="mu">—</span>') + '</td>'
            + '<td>' + (p.products.length ? p.products.map(function(x){ return '<span class="tg">' + esc(x) + '</span>'; }).join('') : '<span class="mu">—</span>') + '</td>'
            + '<td>' + (p.geography.length ? p.geography.map(function(x){ return '<span class="tg g">' + esc(x) + '</span>'; }).join('') : '<span class="mu">—</span>') + '</td>'
            + '<td>' + (p.yearly_target ? '<div class="tbar"><span style="width:' + Math.max(4, Math.round(90 * p.yearly_target / (maxT || 1))) + 'px"></span>₹' + num(p.yearly_target) + ' Cr</div>' : '<span class="mu">—</span>') + '</td>'
            + '<td>' + (p.team_total ? '<b>' + p.team_total + '</b><div class="m">' + (p.team_direct || 0) + ' direct · ' + (p.team_indirect || 0) + ' indirect</div>' : '<span class="mu">—</span>') + '</td>'
            + (OPT.hideCtc ? '' : '<td>' + (p.ctc_current ? num(p.ctc_current) + ' L' : '<span class="mu">—</span>') + '</td>')
            + '<td>' + (p.notice_period ? p.notice_period + ' d' : '<span class="mu">—</span>') + '</td>'
            + '<td>' + esc(p.location || '—') + '</td>'
            + (OPT.client ? '' : '<td class="noprint"><a href="/#mandate/' + p.mandate_id + '/profiles/' + p.id + '" target="_blank" rel="noopener">Profile ↗</a></td>')
            + '</tr>';
        }).join('') + '</tbody></table></div>'
      + '<div class="sub" style="margin-top:8px">Product handling, geography and yearly target come from each profile (Key Facts and the tag boxes). Empty cells mean it is not filled in yet.</div></div>';
    $('app').innerHTML = h; bind();
  }
  // ── Profile groups on the People tab (Sales, Production, Tender, Design …) ─
  var SYS_KEY = {yearly_target: 'yearly_target', team_direct: 'team_direct', team_indirect: 'team_indirect',
                 product_handles: 'products', function_tags: 'functions', geography_tags: 'geography', gender: 'gender'};
  function fval(p, f){ return f.type === 'system' ? p[SYS_KEY[f.sys]] : (p.pvals || {})[f.key]; }
  function fshow(v, f){
    if (v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length)) return '<span class="mu">—</span>';
    if (Array.isArray(v)) return v.map(function(x){ return '<span class="tg">' + esc(x) + '</span>'; }).join('');
    if (f.kind === 'number') return esc(num(v)) + (f.unit ? ' <span class="m">' + esc(f.unit) + '</span>' : '');
    return esc(v);
  }
  function groupChips(){
    if (!D.groups.length) return '';
    var all = D.people.concat(OPT.former ? D.former : []), cnt = {};
    all.forEach(function(p){ var g = p.pgroup || 0; cnt[g] = (cnt[g] || 0) + 1; });
    var chip = function(v, label, n){ var on = String(OPT.group) === String(v);
      return '<button class="chip' + (on ? ' on' : '') + '" data-grp="' + v + '" aria-pressed="' + on + '">' + esc(label) + '<b>' + n + '</b></button>'; };
    return '<div class="chips noprint" style="margin:-4px 0 14px" role="group" aria-label="Profile group">'
      + chip('all', 'All people', all.length)
      + D.groups.map(function(g){ return cnt[g.id] ? chip(g.id, g.name, cnt[g.id]) : ''; }).join('')
      + (cnt[0] ? chip(0, 'Not grouped', cnt[0]) : '') + '</div>';
  }
  function paintGroup(h, g){
    var list = people().slice().sort(function(a, b){ return String(a.name || '').toLowerCase() < String(b.name || '').toLowerCase() ? -1 : 1; });
    var idx = {}; D.people.concat(D.former).forEach(function(p, i){ idx[p.id] = i; });
    var label = function(p){ var i = idx[p.id] || 0; return OPT.client ? 'Candidate ' + String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '') : p.name; };
    var fields = g ? g.fields : [];
    var sum = g ? (D.group_summary || []).filter(function(x){ return x.group_id === g.id; })[0] : null;
    h += '<div class="sub" style="margin:-6px 0 12px">' + (g ? '<b>' + esc(g.name) + '</b> profile: ' + list.length + ' ' + (list.length === 1 ? 'person' : 'people') + '. The fields are the ones set up for this group in Settings &rarr; Profile groups.'
      : 'These people have no profile group yet. Pick one on their profile (Profile card) to see their role fields here.') + '</div>';
    if (sum) {
      var nums = sum.fields.filter(function(f){ return f.kind === 'number'; });
      var cats = sum.fields.filter(function(f){ return f.kind === 'tags' || f.kind === 'choice'; });
      var texts = sum.fields.filter(function(f){ return f.kind === 'text'; });
      if (nums.length) h += '<div class="card"><div class="h">Numbers</div><div class="sub">Current employees · shown only when at least 3 people have the field filled in</div><div class="scroll"><table><thead><tr><th class="ns">Field</th><th class="ns">n</th><th class="ns">Median</th><th class="ns">Range</th>' + (OPT.client ? '' : '<th class="ns">Total</th>') + '</tr></thead><tbody>'
        + nums.map(function(f){ var u = f.unit ? ' ' + esc(f.unit) : '';
            return '<tr><td>' + esc(f.label) + '</td><td>' + f.n + '</td>' + (f.small ? '<td colspan="' + (OPT.client ? 2 : 3) + '"><span class="mu">n too small</span></td>'
              : '<td><b>' + num(f.median) + u + '</b></td><td>' + num(f.min) + ' – ' + num(f.max) + u + '</td>' + (OPT.client ? '' : '<td>' + num(f.total) + u + '</td>')) + '</tr>'; }).join('')
        + '</tbody></table></div></div>';
      if (cats.length) h += '<div class="grid2">' + cats.map(function(f){
          return '<div class="card"><div class="h">' + esc(f.label) + '</div><div class="sub">' + f.n + ' with it filled in</div>' + bars(f.top.slice(0, 10), f.top.length ? f.top[0][1] : 1) + '</div>'; }).join('') + '</div>';
      if (texts.length) h += '<div class="card"><div class="h">Notes fields</div><div class="sub">' + texts.map(function(f){ return esc(f.label) + ': ' + f.n + ' filled'; }).join(' · ')
        + (OPT.client ? ' (text is not shown in the client view)' : '') + '</div></div>';
    }
    var cols = fields.filter(function(f){ return !OPT.client || f.kind === 'tags' || f.kind === 'choice'; });
    h += '<div class="card"><div class="row" style="justify-content:space-between"><div class="h">Side-by-side comparison</div><span class="sub">' + list.length + ' people</span></div><div class="scroll"><table><thead><tr>'
      + '<th class="ns">' + (OPT.client ? 'Candidate' : 'Name') + '</th><th class="ns">Designation</th><th class="ns">Exp</th>'
      + cols.map(function(f){ return '<th class="ns">' + esc(f.label) + (f.kind === 'number' && f.unit ? ' <span class="mu">(' + esc(f.unit) + ')</span>' : '') + '</th>'; }).join('')
      + '<th class="ns">Location</th>' + (OPT.client ? '' : '<th class="ns noprint"></th>') + '</tr></thead><tbody>'
      + list.map(function(p){
          return '<tr><td><b>' + esc(label(p)) + '</b>' + (p.former ? '<span class="fm">Former</span>' : '') + '</td>'
            + '<td>' + esc(p.designation || '—') + '</td><td>' + (p.experience ? num(p.experience) + ' y' : '<span class="mu">—</span>') + '</td>'
            + cols.map(function(f){ return '<td>' + fshow(fval(p, f), f) + '</td>'; }).join('')
            + '<td>' + esc(p.location || '—') + '</td>'
            + (OPT.client ? '' : '<td class="noprint"><a href="/#mandate/' + p.mandate_id + '/profiles/' + p.id + '" target="_blank" rel="noopener">Profile ↗</a></td>') + '</tr>';
        }).join('') + '</tbody></table></div>'
      + (OPT.client && cols.length < fields.length ? '<div class="sub" style="margin-top:8px">Client view: number and text fields are not shown per person; numbers appear above as bands of 3 or more people.</div>' : '')
      + '</div>';
    $('app').innerHTML = h; bind();
  }

  // ── Wave 2: Intelligence tab ────────────────────────────────────────────
  var SIG = {hiring: 'Hiring', freeze: 'Hiring freeze', exit: 'People leaving', join: 'People joining',
             new_order_project: 'New order / project', pay: 'Pay / increments', reorg: 'Re-org', other: 'Other'};
  function pc(v){ return v === null || v === undefined ? '—' : num(v, '0') + '%'; }
  function lakh(v){ return v === null || v === undefined ? '—' : num(v) + ' L'; }
  async function paintIntel(refresh){
    var box = $('intel'); if (!box) return;
    var view = OPT.client ? 'client' : 'internal', ck = D.company + '|' + view;
    var r = (!refresh && IC[ck]) || await api('/intel?view=' + view + '&name=' + encodeURIComponent(D.company) + (refresh ? '&refresh=1' : ''));
    if (!$('intel')) return;
    if (!r.ok) { box.innerHTML = '<div class="card"><div class="err">' + esc(r.error || 'Could not load') + '</div></div>'; return; }
    IC[ck] = r;
    box.innerHTML = intelHTML(r); bindIntel();
  }
  function intelHTML(r){
    var op = r.openness, q = r.quality, P = r.people;
    var h = '<div class="row noprint" style="justify-content:space-between;margin-bottom:10px"><span class="sub">' + (OPT.client ? 'Client view: counts and pay bands only. No names, no individual CTCs, no notes.' : 'Internal view') + ' · bands need at least ' + r.min_n + ' people · computed ' + esc(String(r.generated_at || '').replace('T', ' ').slice(0, 16)) + (r.cached ? ' (cached)' : '') + '</span>'
      + '<button class="btn sm" id="i-refresh">&#8635; Refresh</button></div>';
    h += '<div class="ig">'
      + '<div class="kpi"><span>People known</span><b>' + P.current + '</b><span>current · ' + P.former + ' former</span></div>'
      + '<div class="kpi"><span>Openness</span><b>' + (op.contacted ? pc(op.openness_pct) : '—') + '</b><span>' + op.interested_or_later + ' of ' + op.contacted + ' contacted reached Interested+' + (op.small && op.contacted ? ' · n small' : '') + '</span></div>'
      + '<div class="kpi"><span>Said no</span><b>' + (op.contacted ? pc(op.no_pct) : '—') + '</b><span>' + op.said_no + ' of ' + op.contacted + ' contacted</span></div>'
      + '<div class="kpi"><span>Market notes</span><b>' + r.notes.n + '</b><span>' + (r.notes.by_signal[0] ? 'mostly ' + esc(SIG[r.notes.by_signal[0].signal_type] || r.notes.by_signal[0].signal_type) : 'none yet') + '</span></div></div>';
    // people grid
    var g = P.current_grid;
    h += '<div class="card"><div class="h">People known: role family × level</div><div class="sub">Current employees (' + P.current + ')' + (P.former ? '; ' + P.former + ' former employees are counted separately' : '') + '</div>'
      + (g.families.length ? '<div class="scroll"><table class="mx"><thead><tr><th class="ns">Role family</th>' + g.bands.map(function(b){ return '<th class="ns">' + esc(b) + '</th>'; }).join('') + '<th class="ns">Total</th></tr></thead><tbody>'
        + g.families.map(function(f){ var row = g.cells[f] || {}, t = 0;
            return '<tr><td>' + esc(f) + '</td>' + g.bands.map(function(b){ var n = row[b] || 0; t += n; return '<td class="' + (n ? '' : 'z') + '">' + (n || '·') + '</td>'; }).join('') + '<td><b>' + t + '</b></td></tr>'; }).join('')
        + '</tbody></table></div>' : '<div class="sub" style="margin-top:8px">No current employees of this company in your database.</div>') + '</div>';
    // pay
    if (OPT.hideCtc) h += '<div class="card"><div class="h">Pay</div><div class="sub">Hidden (untick “Hide CTC” to show pay bands).</div></div>';
    else h += '<div class="card"><div class="h">Pay by role family × level</div><div class="sub">Current CTC in ₹ lakh per annum. A band is shown only for ' + r.min_n + ' or more people; hike ask = expected vs current, where both are known.</div>'
      + (r.pay.length ? '<div class="scroll"><table><thead><tr><th class="ns">Role family</th><th class="ns">Level</th><th class="ns">n</th><th class="ns">Current CTC (min · median · max)</th><th class="ns">Median expected</th><th class="ns">Median hike ask</th></tr></thead><tbody>'
        + r.pay.map(function(p){
            return '<tr><td>' + esc(p.family) + '</td><td>' + esc(p.band) + '</td><td>' + p.n + '</td>'
              + (p.small ? '<td colspan="3"><span class="small">n too small</span></td>'
                 : '<td>' + lakh(p.min) + ' · <b>' + lakh(p.median) + '</b> · ' + lakh(p.max) + '</td><td>' + (p.median_expected === null ? '<span class="small">n too small</span>' : lakh(p.median_expected)) + '</td><td>' + (p.median_hike_pct === null ? '<span class="small">n too small</span>' : '<b>' + num(p.median_hike_pct, '0') + '%</b> <span class="mu">(n ' + p.n_hike + ')</span>') + '</td>')
              + '</tr>'; }).join('') + '</tbody></table></div>' : '<div class="sub" style="margin-top:8px">No CTCs recorded yet.</div>') + '</div>';
    // notice + openness
    var nb = r.notice.buckets, nmax = Math.max.apply(null, nb.map(function(b){ return b.n; }).concat([1]));
    h += '<div class="grid2"><div class="card"><div class="h">Notice period</div><div class="sub">' + r.notice.known + ' people with a known notice period</div>' + bars(nb.filter(function(b){ return b.n; }).map(function(b){ return [b.bucket, b.n]; }), nmax) + '</div>'
      + '<div class="card"><div class="h">Openness</div><div class="sub">People we contacted (reached Called or any later stage). n = ' + op.contacted + (op.small && op.contacted ? ' · <span class="small">n small, read with care</span>' : '') + '</div>'
      + (op.contacted ? bars([['Interested or later', op.interested_or_later], ['Said no', op.said_no], ['No answer yet', op.undecided]].filter(function(x){ return x[1]; }), op.contacted) : '<div class="sub" style="margin-top:8px">Nobody from this company contacted yet.</div>') + '</div></div>';
    // reasons + notes
    h += '<div class="grid2"><div class="card"><div class="h">Why people said no</div><div class="sub">Latest reason per person · ' + r.reasons.n + ' with a reason</div>'
      + bars(r.reasons.top.slice(0, 8).map(function(t){ return [t.label, t.n]; }), r.reasons.top[0] ? r.reasons.top[0].n : 1)
      + quotes(r.reasons.recent) + '</div>';
    var sigs = r.notes.by_signal;
    h += '<div class="card"><div class="h">Market notes</div><div class="sub">' + r.notes.n + ' signals about this company' + (OPT.client ? ' (counts only)' : ', newest first') + '</div>'
      + (sigs.length ? '<div class="chips noprint">' + (OPT.client ? '' : '<button class="chip' + (SIGF ? '' : ' on') + '" data-sig="">All</button>') + sigs.map(function(x){ return '<button class="chip' + (SIGF === x.signal_type ? ' on' : '') + '" data-sig="' + esc(x.signal_type) + '">' + esc(SIG[x.signal_type] || x.signal_type) + '<b>' + x.n + '</b></button>'; }).join('') + '</div>' : '<div class="sub" style="margin-top:8px">No market notes yet. Add them from the Call capture card on a profile.</div>')
      + (OPT.client && sigs.length ? bars(sigs.map(function(x){ return [SIG[x.signal_type] || x.signal_type, x.n]; }), sigs[0].n) : '')
      + (r.notes.timeline ? '<div style="margin-top:8px">' + r.notes.timeline.filter(function(n){ return !SIGF || n.signal_type === SIGF; }).slice(0, 30).map(function(n){
          return '<div class="tl"><span class="sig">' + esc(SIG[n.signal_type] || n.signal_type) + '</span>' + esc(n.note) + ' <span class="mu">' + esc(n.date) + (n.source === 'call_ai' ? ' · from a call' : '') + '</span></div>'; }).join('') + '</div>' : '')
      + '</div></div>';
    // client branch
    if (r.client) {
      var cr = r.client.client_rejections, cn = r.client.candidate_no_to_client;
      h += '<div class="card" style="border-top:3px solid var(--green)"><div class="h">' + esc(r.company) + ' as our client</div><div class="sub">Across ' + r.client.jobs + ' job' + (r.client.jobs === 1 ? '' : 's') + ' for this client</div>'
        + '<div class="grid2" style="margin-top:10px"><div><b style="font-size:13px">Why the client rejected candidates</b> <span class="mu">(' + cr.n + ')</span>'
        + bars(cr.top.slice(0, 8).map(function(t){ return [t.label, t.n]; }), cr.top[0] ? cr.top[0].n : 1) + quotes(cr.recent, true) + '</div>'
        + '<div><b style="font-size:13px">Why candidates said no to this client</b> <span class="mu">(' + cn.n + ')</span>'
        + bars(cn.top.slice(0, 8).map(function(t){ return [t.label, t.n]; }), cn.top[0] ? cn.top[0].n : 1)
        + (cn.brand_signals && cn.brand_signals.length ? '<div class="sub" style="margin-top:6px">Employer-brand signals: ' + cn.brand_signals.map(function(t){ return esc(t.label) + ' ' + t.n; }).join(' · ') + '</div>' : '')
        + quotes(cn.recent) + '</div></div></div>';
    }
    // every profile group's own fields (Sales, Production, Tender, Design …), aggregates only
    (r.profile_fields || []).forEach(function(g){
      var nums = g.fields.filter(function(f){ return f.kind === 'number'; });
      var cats = g.fields.filter(function(f){ return (f.kind === 'tags' || f.kind === 'choice') && f.top && f.top.length; });
      var texts = g.fields.filter(function(f){ return f.kind === 'text'; });
      h += '<div class="card"><div class="h">' + esc(g.name) + ' profile fields</div><div class="sub">' + g.people + ' current ' + (g.people === 1 ? 'employee' : 'employees') + ' in this profile group · numbers need at least ' + r.min_n + ' people</div>'
        + (nums.length ? '<div class="scroll" style="margin-top:8px"><table><thead><tr><th class="ns">Field</th><th class="ns">n</th><th class="ns">Median</th><th class="ns">Range</th>' + (OPT.client ? '' : '<th class="ns">Total</th>') + '</tr></thead><tbody>'
          + nums.map(function(f){ var u = f.unit ? ' ' + esc(f.unit) : '';
              return '<tr><td>' + esc(f.label) + '</td><td>' + f.n + '</td>' + (f.small ? '<td colspan="' + (OPT.client ? 2 : 3) + '"><span class="small">n too small</span></td>'
                : '<td><b>' + num(f.median) + u + '</b></td><td>' + num(f.min) + ' – ' + num(f.max) + u + '</td>' + (OPT.client ? '' : '<td>' + num(f.total) + u + '</td>')) + '</tr>'; }).join('')
          + '</tbody></table></div>' : '')
        + (cats.length ? '<div class="grid2" style="margin-top:10px">' + cats.map(function(f){
            return '<div><b style="font-size:13px">' + esc(f.label) + '</b> <span class="mu">(' + f.n + ')</span>' + bars(f.top.slice(0, 8), f.top[0][1]) + '</div>'; }).join('') + '</div>' : '')
        + (texts.length ? '<div class="sub" style="margin-top:8px">' + texts.map(function(f){ return esc(f.label) + ': ' + f.n + ' filled'; }).join(' · ') + '</div>' : '')
        + '</div>';
    });
    // data quality
    h += '<div class="card"><div class="h">Data quality</div><div class="sub">How complete the data behind these numbers is</div><div class="ig" style="margin:10px 0 0">'
      + '<div class="kpi"><span>Expected CTC known</span><b>' + pc(q.expected_ctc_pct) + '</b><span>of ' + q.records + ' people</span></div>'
      + '<div class="kpi"><span>Role family known</span><b>' + pc(q.role_family_pct) + '</b><span>of ' + q.records + ' people</span></div>'
      + '<div class="kpi"><span>“No”s with a reason</span><b>' + pc(q.negatives_with_reason_pct) + '</b><span>of ' + q.negatives + ' negative outcomes</span></div>'
      + '<div class="kpi"><span>Former employees</span><b>' + P.former + '</b><span>from work history</span></div></div></div>';
    return h;
  }
  function quotes(list, fb){
    if (!list || !list.length) return '';
    return list.map(function(x){ return '<div class="qt"><b>' + esc(x.label) + '</b>' + (x.detail ? ': ' + esc(x.detail) : '') + (fb && x.feedback ? '<div>“' + esc(x.feedback) + '”</div>' : '') + ' <span class="mu">' + esc(x.date) + '</span></div>'; }).join('');
  }
  function bindIntel(){
    var rf = $('i-refresh'); if (rf) rf.onclick = function(){ rf.disabled = true; paintIntel(true); };
    document.querySelectorAll('[data-sig]').forEach(function(b){ b.onclick = function(){ if (OPT.client) return; SIGF = b.dataset.sig; paintIntel(false); }; });
  }

  function bind(){
    document.querySelectorAll('[data-tab]').forEach(function(t){ t.onclick = function(){
      OPT.tab = t.dataset.tab;
      try { history.replaceState(null, '', '?company=' + encodeURIComponent(D.company) + (OPT.tab === 'intel' ? '&tab=intel' : '')); } catch(e) {}
      paint(); }; });
    var f = $('o-former'), c = $('o-client'), x = $('o-ctc');
    if (f) f.onchange = function(){ OPT.former = this.checked; saveOpt(); paint(); };
    // client view is fetched again from the server, which leaves out per-person numbers / text of the profile fields
    if (c) c.onchange = function(){ OPT.client = this.checked; if (OPT.client) OPT.hideCtc = true; saveOpt(); show(D.company); };
    document.querySelectorAll('[data-grp]').forEach(function(b){ b.onclick = function(){
      OPT.group = b.dataset.grp === 'all' ? 'all' : +b.dataset.grp; OPT.product = ''; OPT.geo = ''; paint(); }; });
    if (x) x.onchange = function(){ OPT.hideCtc = this.checked; saveOpt(); paint(); };
    document.querySelectorAll('[data-s]').forEach(function(t){ t.onclick = function(){ var k = t.dataset.s; if (OPT.sort === k) OPT.dir = -OPT.dir; else { OPT.sort = k; OPT.dir = (k === 'name' || k === 'designation') ? 1 : -1; } paint(); }; });
    document.querySelectorAll('[data-p]').forEach(function(b){ b.onclick = function(){ OPT.product = b.dataset.p; paint(); }; });
    document.querySelectorAll('[data-g]').forEach(function(b){ b.onclick = function(){ OPT.geo = b.dataset.g; paint(); }; });
    var cp = $('clrp'), cg = $('clrg');
    if (cp) cp.onclick = function(e){ e.preventDefault(); OPT.product = ''; paint(); };
    if (cg) cg.onclick = function(e){ e.preventDefault(); OPT.geo = ''; paint(); };
  }
  init();
})();
</script>
</body>
</html>
