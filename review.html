<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidate Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--muted:#5b6475;--sub:#475063;--line:#e4e7ec;--border:#d0d5dd;--paper:#f5f6f8;--teal:#0f766e;--teal-d:#115e59;--teal-s:#ecfdf5;--red:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:880px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.brand{font-weight:700;font-size:15.5px}
.brand small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.hero{background:#fff;border-bottom:1px solid var(--line)}
.hero .in{max-width:880px;margin:0 auto;padding:28px 20px 26px}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.hero p{font-size:15px;color:var(--sub);margin-top:8px;max-width:620px}
.wrap{max-width:880px;margin:22px auto;padding:0 20px 56px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--teal-d)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--border)}
.btn.o:hover{background:#f8fafc}
.btn.block{width:100%;height:48px;font-size:15.5px}
.fld{display:block;margin-bottom:14px}
.fld > span{display:block;font-size:13px;font-weight:600;color:#344054;margin-bottom:6px}
.fld > span i{font-style:normal;font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink);outline:none}
.fld textarea,textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
.fld.bad input,.fld.bad .tags{border-color:var(--red);box-shadow:0 0 0 3px rgba(180,35,24,.1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sec{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 12px}
.state{padding:48px 24px;text-align:center}
.state .ic{width:52px;height:52px;border-radius:50%;background:var(--teal-s);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.state.warn .ic{background:#fef3f2;color:var(--red)}
.state h3{font-size:17px;font-weight:700}
.state p{font-size:14px;color:var(--muted);margin-top:6px;max-width:420px;margin-left:auto;margin-right:auto}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:18px}
.foot{text-align:center;font-size:12.5px;color:#98a2b3;margin-top:30px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:560px){.g2{grid-template-columns:1fr}.hero h1{font-size:23px}.hero .in{padding:22px 16px}.wrap{padding:0 14px 48px;margin-top:16px}.topbar .in{padding:12px 16px}}

.note{background:#f0fdfa;border:1px solid #b6dcd6;color:#134e4a;font-size:14px;line-height:1.55;padding:12px 16px;border-radius:12px;margin-bottom:16px}
.rc{padding:18px 20px;margin-bottom:12px}
.top{display:flex;align-items:flex-start;gap:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--teal-s);color:var(--teal);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.nm{font-size:17px;font-weight:700}
.sub{font-size:14px;color:var(--sub);margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;background:#f2f4f7;color:#344054;border-radius:999px;padding:3px 10px}
.sum{font-size:14px;color:var(--sub);line-height:1.6;margin-top:10px}
.done{background:var(--teal-s);border:1px solid #a6e3c8;color:var(--teal);font-size:14px;font-weight:600;padding:10px 12px;border-radius:10px;margin-top:12px}
.given{background:#f8fafc;border-left:3px solid #cbd5e1;border-radius:0 8px 8px 0;padding:8px 12px;margin-top:8px;font-size:13.5px;color:#344054}
.form{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.form .g2{gap:10px;margin-bottom:10px}
.form .inp{margin-bottom:10px}
.form .g2 .inp{margin-bottom:0}
.recs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{height:40px}
</style>
</head>
<body>
<header class="topbar"><div class="in"><span class="mark" aria-hidden="true">H</span><span class="brand">Candidate review<small>Shortlist shared with you</small></span></div></header>
<section class="hero"><div class="in">
  <h1 id="role">Candidate review</h1>
  <p id="sub"></p>
</div></section>

<main class="wrap">
  <div id="list"><div class="card state"><div class="spin" aria-hidden="true"></div><h3>Loading…</h3></div></div>
  <div class="foot">Powered by HireLab</div>
</main>

<script>
// Token-gated review page. No login: the link itself is the credential, and it
// only ever reaches one requisition. Contact details and salary are not sent
// by the server at all, so they cannot leak through this page.
var P = new URLSearchParams(location.search);
var MID = P.get('m') || '';
var TOK = P.get('t') || '';
var DATA = null;
var SENT = {};   // candidate ids this browser has already reviewed

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
var ICON = {
  wait:'<div class="spin" aria-hidden="true"></div>',
  search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',
  warn:'M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
  lock:'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4',
  bag:'M3 8h18v12H3zM8 8V5h8v3',
  ok:'M5 12l5 5L20 7',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0'
};
function iconHtml(k){
  if (k === 'wait') return ICON.wait;
  return '<span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(ICON[k]||ICON.ok)+'"/></svg></span>';
}
function state(ic,t,m){
  document.getElementById('list').innerHTML =
    '<div class="card state'+(ic==='warn'?' warn':'')+'">'+iconHtml(ic)+'<h3>'+esc(t)+'</h3>'+(m?'<p>'+esc(m)+'</p>':'')+'</div>';
}

var REC = {strong_yes:'Strong yes', yes:'Yes', hold:'Hold', no:'No'};

function card(c){
  var chips = '';
  if (c.experience) chips += '<span class="chip">'+esc(c.experience)+' yrs</span>';
  if (c.location)   chips += '<span class="chip">'+esc(c.location)+'</span>';
  if (c.qualification) chips += '<span class="chip">'+esc(c.qualification)+'</span>';
  (c.skills||[]).forEach(function(s){ chips += '<span class="chip">'+esc(s)+'</span>'; });

  var given = (c.feedback||[]).map(function(f){
    return '<div class="given"><b>'+esc(f.panelist||'')+'</b> — '+esc(REC[f.recommendation]||f.recommendation)
      + (f.rating?(' · '+f.rating+'/5'):'')
      + (f.strengths?('<br>'+esc(f.strengths)):'') + '</div>';
  }).join('');

  var body;
  if (SENT[c.id]) {
    body = '<div class="done" role="status">Thank you — your feedback has been recorded.</div>';
  } else {
    body = '<button class="btn" style="margin-top:14px" onclick="openForm('+c.id+')">Give feedback</button>'
         + '<div id="f-'+c.id+'"></div>';
  }

  var ini = String(c.name||'?').trim().split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
  return '<article class="card rc">'
    + '<div class="top"><span class="av" aria-hidden="true">'+esc(ini)+'</span><div style="flex:1;min-width:0">'
      + '<div class="nm">'+esc(c.name)+'</div>'
      + '<div class="sub">'+esc(c.designation||'')+(c.company?(' at '+esc(c.company)):'')+'</div>'
    + '</div></div>'
    + (chips ? '<div class="chips">'+chips+'</div>' : '')
    + (c.summary ? '<div class="sum">'+esc(c.summary)+'</div>' : '')
    + given
    + body
    + '</article>';
}

function render(){
  document.getElementById('list').innerHTML = DATA.candidates.map(card).join('');
}

function openForm(cid){
  var box = document.getElementById('f-'+cid);
  if (!box) return;
  if (box.innerHTML){ box.innerHTML=''; return; }
  box.innerHTML = '<div class="form">'
    + '<div class="g2">'
      + '<input class="inp" id="n-'+cid+'" placeholder="Your name" aria-label="Your name" autocomplete="name">'
      + '<select class="inp" id="r-'+cid+'" aria-label="Your recommendation"><option value="">Your recommendation…</option>'
        + '<option value="strong_yes">Strong yes</option><option value="yes">Yes</option>'
        + '<option value="hold">Hold</option><option value="no">No</option></select>'
    + '</div>'
    + '<select class="inp" id="rt-'+cid+'" aria-label="Rating"><option value="0">Rating (optional)</option>'
      + '<option value="5">5 — Outstanding</option><option value="4">4 — Strong</option>'
      + '<option value="3">3 — Adequate</option><option value="2">2 — Weak</option>'
      + '<option value="1">1 — Poor</option></select>'
    + '<textarea class="inp" id="s-'+cid+'" rows="2" placeholder="What stood out" aria-label="What stood out"></textarea>'
    + '<textarea class="inp" id="c-'+cid+'" rows="2" placeholder="Any concerns" aria-label="Any concerns"></textarea>'
    + '<div class="acts"><button class="btn" onclick="send('+cid+')">Submit feedback</button>'
    + '<button class="btn o" onclick="openForm('+cid+')">Cancel</button></div>'
    + '<div id="e-'+cid+'" class="err" role="alert"></div>'
    + '</div>';
  var n = document.getElementById('n-'+cid);
  // Panelists usually review several people in one sitting, so carry the name.
  if (n){ if (window._lastName) n.value = window._lastName; n.focus(); }
}

async function send(cid){
  var g = function(p){ var e=document.getElementById(p+'-'+cid); return e?e.value.trim():''; };
  var err = document.getElementById('e-'+cid);
  if (!g('n')){ err.textContent='Please enter your name.'; return; }
  if (!g('r')){ err.textContent='Please pick a recommendation.'; return; }
  err.textContent = 'Sending…'; err.style.color = '#5b6475';
  window._lastName = g('n');
  var res;
  try {
    var q = await fetch('/api/review/'+encodeURIComponent(MID)+'/feedback?t='+encodeURIComponent(TOK), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({candidate_id:cid, panelist:g('n'), recommendation:g('r'),
        rating: parseInt(g('rt'))||0, strengths:g('s'), concerns:g('c')})
    });
    res = await q.json();
  } catch(e){ err.style.color='#b42318'; err.textContent='Could not send. Please try again.'; return; }
  if (!res || !res.ok){
    err.style.color='#b42318'; err.textContent=(res && res.error) || 'Could not send. Please try again.'; return;
  }
  SENT[cid] = true;
  render();
}

(async function(){
  if (!MID || !TOK){ state('lock','This link is incomplete','Please use the full link you were sent.'); return; }
  var r;
  try {
    var q = await fetch('/api/review/'+encodeURIComponent(MID)+'?t='+encodeURIComponent(TOK));
    r = await q.json();
  } catch(e){ state('warn','Could not load','Please refresh in a moment.'); return; }

  if (!r || !r.ok){
    state('lock','This link is not valid', (r && r.error) || 'It may have expired. Ask the recruiter for a fresh link.');
    return;
  }
  DATA = r;
  document.getElementById('role').textContent = r.role || 'Candidate Review';
  document.getElementById('sub').textContent =
    (r.label || 'Requisition') + (r.location ? (' · ' + r.location) : '');

  if (!(r.candidates||[]).length){
    state('user','No candidates to review yet','The recruiter will share profiles here as they are shortlisted.');
    return;
  }
  document.getElementById('list').innerHTML =
    '<div class="note">Please review the shortlist below and give your feedback on each candidate. '
    + 'You do not need an account — this link is just for you.</div>';
  var d = document.createElement('div');
  d.innerHTML = DATA.candidates.map(card).join('');
  document.getElementById('list').appendChild(d);
  render = function(){
    d.innerHTML = DATA.candidates.map(card).join('');
  };
})();
</script>
</body>
</html>
