<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Careers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--muted:#5b6475;--sub:#475063;--line:#e4e7ec;--border:#d0d5dd;--paper:#f5f6f8;--teal:#0f766e;--teal-d:#115e59;--teal-s:#ecfdf5;--red:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:880px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.brand{font-weight:700;font-size:15.5px}
.brand small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.hero{background:#fff;border-bottom:1px solid var(--line)}
.hero .in{max-width:880px;margin:0 auto;padding:28px 20px 26px}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.hero p{font-size:15px;color:var(--sub);margin-top:8px;max-width:620px}
.wrap{max-width:880px;margin:22px auto;padding:0 20px 56px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--teal-d)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--border)}
.btn.o:hover{background:#f8fafc}
.btn.block{width:100%;height:48px;font-size:15.5px}
.fld{display:block;margin-bottom:14px}
.fld > span{display:block;font-size:13px;font-weight:600;color:#344054;margin-bottom:6px}
.fld > span i{font-style:normal;font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink);outline:none}
.fld textarea,textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
.fld.bad input,.fld.bad .tags{border-color:var(--red);box-shadow:0 0 0 3px rgba(180,35,24,.1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sec{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 12px}
.state{padding:48px 24px;text-align:center}
.state .ic{width:52px;height:52px;border-radius:50%;background:var(--teal-s);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.state.warn .ic{background:#fef3f2;color:var(--red)}
.state h3{font-size:17px;font-weight:700}
.state p{font-size:14px;color:var(--muted);margin-top:6px;max-width:420px;margin-left:auto;margin-right:auto}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:18px}
.foot{text-align:center;font-size:12.5px;color:#98a2b3;margin-top:30px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:560px){.g2{grid-template-columns:1fr}.hero h1{font-size:23px}.hero .in{padding:22px 16px}.wrap{padding:0 14px 48px;margin-top:16px}.topbar .in{padding:12px 16px}}

.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar .q{flex:1 1 260px;position:relative}
.bar .q svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.bar .q input{padding-left:38px}
.bar select{flex:0 1 220px}
.count{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.job{padding:18px 20px;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.job:hover{border-color:#b6dcd6;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.job-top{display:flex;align-items:flex-start;gap:14px}
.job h2{font-size:17px;font-weight:700;flex:1;min-width:0;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;background:#f2f4f7;color:#344054;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.ctc{background:var(--teal-s);color:var(--teal);font-weight:600}
.jd{font-size:14px;color:var(--sub);line-height:1.6;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:560px){.job-top{flex-direction:column;gap:10px}.job .btn{width:100%}}
</style>
</head>
<body>

<header class="topbar"><div class="in"><span class="mark" id="mark" aria-hidden="true">C</span><span class="brand" id="brand">Careers</span></div></header>
<section class="hero"><div class="in">
  <h1 id="co">Open positions</h1>
  <p id="intro">Find a role that fits and apply in two minutes.</p>
</div></section>

<main class="wrap">
  <div id="bar" class="bar" style="display:none" role="search">
    <label class="q"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5"/></svg><input id="q" class="inp" placeholder="Search role or keyword" aria-label="Search role or keyword" autocomplete="off"></label>
    <select id="loc" class="inp" aria-label="Location"><option value="">All locations</option></select>
  </div>
  <div id="count" class="count" aria-live="polite"></div>
  <div id="list">
    <div class="card state"><div class="spin" aria-hidden="true"></div><h3>Loading openings…</h3></div>
  </div>
  <div class="foot">Powered by HireLab</div>
</main>

<script>
// Public page: no auth, no tenant data beyond what the server chooses to
// publish. The company is identified by ?c= so one deployment serves every
// tenant's careers page.
var params = new URLSearchParams(location.search);
var CID = params.get('c') || '';
var JOBS = [];

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
var ICON = {
  wait:'<div class="spin" aria-hidden="true"></div>',
  search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',
  warn:'M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
  lock:'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4',
  bag:'M3 8h18v12H3zM8 8V5h8v3',
  ok:'M5 12l5 5L20 7',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0'
};
function iconHtml(k){
  if (k === 'wait') return ICON.wait;
  return '<span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(ICON[k]||ICON.ok)+'"/></svg></span>';
}

function state(icon, title, msg){
  document.getElementById('list').innerHTML =
    '<div class="card state'+(icon==='warn'?' warn':'')+'">'+iconHtml(icon)+'<h3>'+esc(title)+'</h3>'
    + (msg ? '<p>'+esc(msg)+'</p>' : '') + '</div>';
  document.getElementById('count').textContent = '';
}

function applyUrl(job){
  var u = '/apply?m=' + encodeURIComponent(job.id);
  if (CID) u += '&c=' + encodeURIComponent(CID);
  u += '&src=careers';
  return u;
}

function render(){
  var q = (document.getElementById('q').value || '').trim().toLowerCase();
  var loc = document.getElementById('loc').value || '';
  var shown = JOBS.filter(function(j){
    if (loc && (j.location||'') !== loc) return false;
    if (!q) return true;
    return (j.role+' '+(j.division||'')+' '+(j.jd||'')).toLowerCase().indexOf(q) >= 0;
  });

  document.getElementById('count').textContent =
    shown.length + (shown.length === 1 ? ' opening' : ' openings');

  if (!shown.length){
    state('search', 'Nothing matches that', 'Try a different keyword or clear the filters.');
    return;
  }

  document.getElementById('list').innerHTML = shown.map(function(j){
    var chips = '';
    if (j.location)   chips += '<span class="chip">'+esc(j.location)+'</span>';
    if (j.experience) chips += '<span class="chip">'+esc(j.experience)+'</span>';
    if (j.division)   chips += '<span class="chip">'+esc(j.division)+'</span>';
    if (j.ctc)        chips += '<span class="chip ctc">'+esc(j.ctc)+'</span>';
    return '<article class="card job">'
      + '<div class="job-top"><div style="flex:1;min-width:0"><h2>'+esc(j.role)+'</h2>'
      + (chips ? '<div class="meta">'+chips+'</div>' : '') + '</div>'
      + '<a class="btn" href="'+esc(applyUrl(j))+'" aria-label="Apply for '+esc(j.role)+'">Apply</a></div>'
      + (j.jd ? '<div class="jd">'+esc(j.jd)+'</div>' : '')
      + '</article>';
  }).join('');
}

(async function(){
  var r;
  try {
    var res = await fetch('/api/public/openings' + (CID ? ('?c='+encodeURIComponent(CID)) : ''));
    r = await res.json();
  } catch(e){
    state('warn', 'Could not load openings', 'Please refresh the page in a moment.');
    return;
  }
  if (!r || !r.ok){
    state('warn', 'Could not load openings', 'Please refresh the page in a moment.');
    return;
  }
  if (r.enabled === false){
    document.getElementById('co').textContent = 'Careers';
    document.getElementById('intro').textContent = '';
    state('lock', 'This careers page is not published', 'Please check the link, or get in touch with the recruiter directly.');
    return;
  }

  if (r.company){
    document.getElementById('brand').textContent = r.company;
    document.getElementById('mark').textContent = String(r.company).trim().charAt(0).toUpperCase() || 'C';
    document.getElementById('co').textContent = 'Careers at ' + r.company;
    document.title = r.company + ' — Careers';
  }
  if (r.intro) document.getElementById('intro').textContent = r.intro;

  JOBS = r.openings || [];
  if (!JOBS.length){
    state('bag', 'No open positions right now', 'Do check back — new roles are posted here as they open.');
    return;
  }

  var locs = [];
  JOBS.forEach(function(j){ if (j.location && locs.indexOf(j.location) < 0) locs.push(j.location); });
  locs.sort();
  var sel = document.getElementById('loc');
  locs.forEach(function(l){
    var o = document.createElement('option'); o.value = l; o.textContent = l; sel.appendChild(o);
  });
  // Filters only earn their space once there is enough to filter.
  if (JOBS.length > 3 || locs.length > 1) document.getElementById('bar').style.display = 'flex';

  document.getElementById('q').addEventListener('input', render);
  sel.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
