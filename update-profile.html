<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Your Profile — HireLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--muted:#5b6475;--sub:#475063;--line:#e4e7ec;--border:#d0d5dd;--paper:#f5f6f8;--teal:#0f766e;--teal-d:#115e59;--teal-s:#ecfdf5;--red:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:880px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.brand{font-weight:700;font-size:15.5px}
.brand small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.hero{background:#fff;border-bottom:1px solid var(--line)}
.hero .in{max-width:880px;margin:0 auto;padding:28px 20px 26px}
.hero h1{font-size:28px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.hero p{font-size:15px;color:var(--sub);margin-top:8px;max-width:620px}
.wrap{max-width:880px;margin:22px auto;padding:0 20px 56px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 18px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--teal-d)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.o{background:#fff;color:var(--ink);border:1px solid var(--border)}
.btn.o:hover{background:#f8fafc}
.btn.block{width:100%;height:48px;font-size:15.5px}
.fld{display:block;margin-bottom:14px}
.fld > span{display:block;font-size:13px;font-weight:600;color:#344054;margin-bottom:6px}
.fld > span i{font-style:normal;font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{width:100%;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink);outline:none}
.fld textarea,textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.14)}
.fld.bad input,.fld.bad .tags{border-color:var(--red);box-shadow:0 0 0 3px rgba(180,35,24,.1)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sec{font-size:12px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 12px}
.state{padding:48px 24px;text-align:center}
.state .ic{width:52px;height:52px;border-radius:50%;background:var(--teal-s);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.state.warn .ic{background:#fef3f2;color:var(--red)}
.state h3{font-size:17px;font-weight:700}
.state p{font-size:14px;color:var(--muted);margin-top:6px;max-width:420px;margin-left:auto;margin-right:auto}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:18px}
.foot{text-align:center;font-size:12.5px;color:#98a2b3;margin-top:30px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:560px){.g2{grid-template-columns:1fr}.hero h1{font-size:23px}.hero .in{padding:22px 16px}.wrap{padding:0 14px 48px;margin-top:16px}.topbar .in{padding:12px 16px}}

.body{padding:22px 24px}
.upload{display:block;border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:.15s;background:#fcfcfd}
.upload:hover{border-color:var(--teal);background:#f0fdfa}
.upload.has-file{border-color:var(--teal);border-style:solid;background:var(--teal-s)}
.upload .ui{width:42px;height:42px;border-radius:50%;background:var(--teal-s);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;margin-bottom:6px}
#upext{font-size:14px;color:var(--teal);font-weight:600}
@media(max-width:560px){.body{padding:18px 16px}}
.topbar .in,.hero .in{max-width:640px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:13.5px;cursor:pointer;background:#fff;user-select:none}
.pick label.on{border-color:var(--teal);background:var(--teal-s);color:var(--teal-d);font-weight:600}
.pick input{display:none}
</style>
</head>
<body>
<header class="topbar"><div class="in"><span class="mark" aria-hidden="true">H</span><span class="brand">HireLab<small>Secure candidate portal</small></span></div></header>
<section class="hero"><div class="in">
  <h1>Update your profile</h1>
  <p>Please confirm your details and upload your latest resume. It takes about a minute.</p>
</div></section>
<main class="wrap" style="max-width:640px">
  <div class="card">
    <div id="content">
      <div class="state"><div class="spin" aria-hidden="true"></div><h3>Loading your profile…</h3></div>
    </div>
  </div>
  <div class="foot">Powered by HireLab &middot; Your details are shared only with the hiring team</div>
</main>

<script>
var TOKEN = new URLSearchParams(location.search).get('token') || '';
var API = '/api/public/candidate-update/' + TOKEN;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
var ICON = {
  wait:'<div class="spin" aria-hidden="true"></div>',
  search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',
  warn:'M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z',
  lock:'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4',
  bag:'M3 8h18v12H3zM8 8V5h8v3',
  ok:'M5 12l5 5L20 7',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0'
};
function iconHtml(k){
  if (k === 'wait') return ICON.wait;
  return '<span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(ICON[k]||ICON.ok)+'"/></svg></span>';
}

async function load(){
  var box = document.getElementById('content');
  if(!TOKEN){ box.innerHTML = errHtml('Invalid link', 'This link is missing its security token.'); return; }
  try{
    var res = await fetch(API);
    var data = await res.json();
    if(!data.ok){ box.innerHTML = errHtml('Link not valid', data.error || 'This link is invalid or has expired.'); return; }
    renderForm(data.candidate);
  }catch(e){
    box.innerHTML = errHtml('Something went wrong', 'Please try again later.');
  }
}

function errHtml(title, sub){
  return '<div class="state warn">'+iconHtml('warn')+'<h3>'+esc(title)+'</h3><p>'+esc(sub)+'</p></div>';
}

function field(id, label, val, type){
  return '<label class="fld"><span>'+label+'</span><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'"'+(type==='number'?' inputmode="decimal"':'')+'></label>';
}

function renderForm(c){
  var box = document.getElementById('content');
  var skills = (c.key_skills||[]).join(', ');
  box.innerHTML =
    '<div class="body">'
    + '<div class="sec" style="margin-top:0">About you</div>'
    + field('name','Full name', c.name)
    + '<div class="g2">' + field('phone','Phone', c.phone, 'tel') + field('email','Email', c.email, 'email') + '</div>'
    + '<div class="g2">' + field('location','Current location', c.location) + field('preferred_location','Preferred location', c.preferred_location) + '</div>'
    + '<div class="sec">Work</div>'
    + '<div class="g2">' + field('company','Current company', c.company) + field('designation','Designation', c.designation) + '</div>'
    + '<div class="g2">' + field('experience','Experience (years)', c.experience, 'number') + field('qualification','Education', c.qualification) + '</div>'
    + '<div class="g2">' + field('ctc_current','Current CTC (LPA)', c.ctc_current, 'number') + field('ctc_expected','Expected CTC (LPA)', c.ctc_expected, 'number') + '</div>'
    + field('notice_period','Notice period (days)', c.notice_period, 'number')
    + '<label class="fld"><span>Key skills <i>(comma separated)</i></span><textarea id="key_skills" rows="2">'+esc(skills)+'</textarea></label>'
    + '<div id="interests"></div>'
    + '<div class="fld"><span>Latest resume <i>(PDF / Word)</i></span>'
    + '<label class="upload" id="upbox"><span class="ui"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg></span><div id="upext">Tap to choose your resume file</div>'
    + '<input type="file" id="resume" accept=".pdf,.doc,.docx" style="display:none" onchange="onFile()"></label></div>'
    + '<div class="err" id="up-err" role="alert"></div>'
    + '<button class="btn block" id="submitBtn" onclick="submitForm()">Submit updated profile</button>'
    + '</div>';
  loadInterests();
}

// What the candidate wants to hear about (Talent Pool segments) — optional; hidden if unavailable.
var INTERESTS = null;
async function loadInterests(){
  try{
    var r = await fetch('/api/public/talent-interests/' + TOKEN);
    var j = await r.json();
    if(!j.ok) return;
    INTERESTS = j;
    function group(name, list, chosen){
      return '<div class="pick" data-grp="'+name+'">' + list.map(function(x){
        var on = chosen.indexOf(x.key) >= 0;
        return '<label class="'+(on?'on':'')+'"><input type="checkbox" value="'+esc(x.key)+'"'+(on?' checked':'')+'>'+esc(x.label)+'</label>';
      }).join('') + '</div>';
    }
    document.getElementById('interests').innerHTML =
      '<div class="sec">What would you like to hear about?</div>'
      + '<label class="fld"><span>Industries <i>(pick any)</i></span></label>' + group('ind', j.industries, j.chosen_industries || [])
      + '<label class="fld" style="margin-top:14px"><span>Kind of roles <i>(pick any)</i></span></label>' + group('fun', j.functions, j.chosen_functions || [])
      + '<div style="height:18px"></div>';
    document.querySelectorAll('.pick label').forEach(function(l){
      l.addEventListener('click', function(e){ e.preventDefault(); var i = l.querySelector('input'); i.checked = !i.checked; l.classList.toggle('on', i.checked); });
    });
  }catch(e){}
}
function picked(grp){
  return Array.prototype.map.call(document.querySelectorAll('.pick[data-grp="'+grp+'"] input:checked'), function(i){ return i.value; });
}

function onFile(){
  var f = document.getElementById('resume').files[0];
  var box = document.getElementById('upbox');
  var ext = document.getElementById('upext');
  if(f){ box.classList.add('has-file'); ext.textContent = f.name + ' — ready to upload'; }
}

async function submitForm(){
  var btn = document.getElementById('submitBtn');
  var err = document.getElementById('up-err'); if (err) err.textContent = '';
  btn.disabled = true; btn.textContent = 'Submitting…';
  var fd = new FormData();
  ['name','phone','email','company','designation','experience','qualification','ctc_current','ctc_expected','notice_period','location','preferred_location'].forEach(function(id){
    var el = document.getElementById(id); if(el) fd.append(id, el.value);
  });
  var ks = document.getElementById('key_skills').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  fd.append('key_skills', JSON.stringify(ks));
  var rf = document.getElementById('resume').files[0];
  if(rf) fd.append('resume', rf);
  if(INTERESTS){ fd.append('interest_industries', JSON.stringify(picked('ind'))); fd.append('interest_functions', JSON.stringify(picked('fun'))); }

  try{
    var res = await fetch(API, { method:'POST', body: fd });
    var data = await res.json();
    if(data.ok){
      document.getElementById('content').innerHTML =
        '<div class="state">'+iconHtml('ok')+'<h3>Thank you!</h3><p>Your profile has been updated. Our team will be in touch soon.</p></div>';
      window.scrollTo(0,0);
    } else {
      btn.disabled = false; btn.textContent = 'Submit updated profile';
      if (err) err.textContent = data.error || 'Submission failed. Please try again.';
    }
  }catch(e){
    btn.disabled = false; btn.textContent = 'Submit updated profile';
    if (err) err.textContent = 'Something went wrong. Please try again.';
  }
}

load();
</script>
</body>
</html>
